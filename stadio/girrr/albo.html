<script>
(function(){
var D=null;
function cap(s){s=String(s);return s.charAt(0).toUpperCase()+s.slice(1)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pt(x){return String(Math.round(x*100)/100).replace('.',',')}
document.getElementById('lg').onclick=function(){location.href='index.html'};
/* tutte le partite giocate, in un'unica lista */
function tutte(){
  var L=[];
  D.cal.lega.forEach(function(g){g.m.forEach(function(m){if(m[4]==='-')return;var s=m[4].split('-').map(Number);
    L.push({c:m[0],f:m[3],pc:m[1],pf:m[2],gc:s[0],gf:s[1],sa:g.sa,n:g.n,comp:'Campionato'})})});
  D.cal.cup.forEach(function(g){g.m.forEach(function(m){if(m[5]==='-')return;var s=m[5].split('-').map(Number);
    L.push({c:m[1],f:m[4],pc:m[2],pf:m[3],gc:s[0],gf:s[1],sa:g.sa,n:g.n,comp:'Champions Cup'})})});
  return L;
}
function dove(m){return m.comp+' · '+m.n+'ª giornata'}
function trofei(){
  var h='<div class="tr">'
   +'<div class="card"><div class="coppa">🏆</div><h4>Campionato 2026/27</h4><div class="st">In corso · Giocata la '+(lastN(D.cal.lega,false))+'ª giornata</div><div class="vinc">Da assegnare</div></div>'
   +'<div class="card"><div class="coppa">⭐</div><h4>Champions Cup 2026/27</h4><div class="st">'+(lastN(D.cal.cup,true)?'In corso · Gironi giocati: '+lastN(D.cal.cup,true)+' giornate su '+D.cal.cup.length:'Parte alla prossima giornata · '+D.cal.cup.length+' giornate di gironi')+'</div><div class="vinc">Da assegnare</div></div></div>';
  return h;
}
function lastN(c,cup){var l=0,i=cup?5:4;c.forEach(function(g){if(g.m.some(function(m){return m[i]!=='-'}))l=g.n});return l}
function serie(L){
  /* serie di vittorie piu' lunga di ogni squadra, in ordine di giornata di Serie A */
  var best={n:0,t:''},cur={},ord=L.slice().sort(function(a,b){return a.sa-b.sa});
  ord.forEach(function(m){[[m.c,m.gc,m.gf],[m.f,m.gf,m.gc]].forEach(function(x){var t=x[0];
    if(x[1]>x[2]){cur[t]=(cur[t]||0)+1;if(cur[t]>best.n)best={n:cur[t],t:t}}else cur[t]=0})});
  return {best:best,cur:cur};
}
function recs(){
  var L=tutte();if(!L.length)return '<div class="card"><div class="vuoto">I record si riempiono dopo la prima giornata.</div></div>';
  var R=[];
  function best(f,cmp){var b=null;L.forEach(function(m){var v=f(m);if(v&&(b===null||cmp(v.val,b.val)))b=v});return b}
  var hi=best(function(m){return m.pc>=m.pf?{val:m.pc,t:m.c,m:m,o:m.f}:{val:m.pf,t:m.f,m:m,o:m.c}},function(a,b){return a>b});

  var largo=best(function(m){var d=Math.abs(m.pc-m.pf);return {val:d,t:m.pc>m.pf?m.c:m.f,m:m,o:m.pc>m.pf?m.f:m.c}},function(a,b){return a>b});

  var gol=best(function(m){return {val:m.gc+m.gf,t:m.c,m:m,o:m.f}},function(a,b){return a>b});
  var sfort=null;L.forEach(function(m){[[m.f,m.pc,m.c,m.pf,m.gc>m.gf],[m.c,m.pf,m.f,m.pc,m.gf>m.gc]].forEach(function(x){/* x: vincitrice,pt vincitrice? */})});
  /* piu' sfortunata: piu' punti in una sconfitta; piu' fortunata: meno punti in una vittoria */
  var sf=null,fo=null;
  L.forEach(function(m){
    if(m.gc>m.gf){ if(!fo||m.pc<fo.val)fo={val:m.pc,t:m.c,m:m,o:m.f}; if(!sf||m.pf>sf.val)sf={val:m.pf,t:m.f,m:m,o:m.c} }

  var h='';

  h+=row('🧊','Punteggio più basso',lo.t,'contro '+esc(cap(lo.o))+' · '+dove(lo.m),pt(lo.val));

 "DJ Cst Brazil":["Il Ritorno","Nel 2021/22 si presenta in lega un tipo misterioso, con il nome di StaCo Atto e una squadra, il Rapid Micatant, che nessuno prende troppo sul serio. Invece chiude 5° con 51 punti, a due soli dal 4° posto e a 19 dall'apo campione: abbastanza per farsi notare, ma troppo poco per farsi ricordare. Subito dopo sparisce, e intorno a lui nascono le leggende: c'è chi giura che sia partito per un lungo viaggio, chi che si sia chiuso in uno studio di registrazione a cercare il beat perfetto, chi che sia semplicemente andato a vincere altrove. Cinque stagioni dopo, quando la lega parla ormai d'altro, una porta si apre e lui torna con un nome nuovo, DJ Cst Brazil, un altro fuso orario e una squadra con i colori dell'Olanda, l'Oranje VC. Nessuno sa bene da dove arrivi, ma tutti hanno capito che non è tornato per fare presenza: le cuffie sono già sulle orecchie, il volume è alto e la classifica, stavolta, è la sua pista da ballo."],
 "apo":["Il Re dei Traslochi","Il Wakanda nasce da re: campione al debutto nel 2021/22, campione ancora nel 2022/23, e due titoli di fila, ancora oggi, non li ha vinti nessun altro. Poi il regno comincia a scricchiolare, con il 6° posto del 2023/24 e il tracollo del 2024/25, ultimo e a 34 punti dal PornHub FC campione. L'anno dopo, con il nome New Wakanda, chiude ultimo ancora. A quel punto cambia di nuovo casa e quest'anno riparte con l'Apo Team, la terza squadra in cinque anni ma sempre con lo stesso allenatore al timone: uno che fa i traslochi ma non dimentica la strada del trono. Da dinastia a cantiere aperto, ma le dinastie hanno la memoria lunga."],
 "ser":["Il Guerriero Paziente","Cinque stagioni, una sola squadra, un solo nome, e mai un passo indietro nella lealtà: la WOA c'è dal 2021/22 e non si è mai mossa di un millimetro, neanche quando sarebbe stato più comodo. Esordisce con un 4° posto e l'anno dopo è 2°, dietro soltanto all'apo. Poi arriva il 2023/24, l'anno nero, 9° e penultimo, quello in cui chiunque avrebbe cambiato squadra, nome e magari città. Lui no. Risale al 5° posto nel 2024/25 e nel 2025/26 arriva il momento che aspettava da quattro anni: la Gioberti Cup, vinta con 65 punti, 10 più del Grodah secondo, il margine più largo tra i titoli che conosciamo. Dal 9° al 1° in due anni, perché la pazienza, a volte, è solo un trofeo che non ha ancora il tuo nome sopra."],
 "RikyArma":["La Scalata","Comincia dal basso, anzi dal basso del basso: 7° nel 2021/22 con il Tequila Bum Bum, e quando cambia squadra e passa al Grodah il 2022/23 va ancora peggio, ultimo in un campionato a sei. Qualcuno, a quel punto, avrebbe cambiato lega; lui ha cambiato soltanto marcia. Il 2023/24 lo porta sul podio, 3° con gli stessi punti del 2°. Poi una frenata, il 6° posto del 2024/25, e infine il 2025/26 che sembrava già scritto: 2° in campionato, a soli 10 punti dalla WOA, e per di più la Coppa Campioni, vinta in finale contro il Mugiwara per 4-1. Dall'ultimo posto alla coppa in tre stagioni, con un solo cambio di squadra e tanta pazienza: in bacheca c'è un trofeo, e c'è un posto vuoto, quello dello scudetto."],
 "Leanzino":["Da Solo, Poi in Coppia","Il Mugiwara debutta da protagonista, 2° nel 2021/22 a soli 5 punti dal Wakanda. Poi un anno di silenzio, perché nel 2022/23 il suo nome non compare, e un ritorno da campione nel 2023/24, con il titolo conquistato per appena 2 punti su Sdrogo e Grodah. Da lì comincia la lenta discesa: 4° nel 2024/25 a un solo punto dal podio e 8° nel 2025/26, anche se nello stesso anno trova la forza per arrivare in finale di Coppa Campioni, persa 4-1 proprio contro il Grodah. Dopo anni da solo, quest'anno cambia formula: il Mugiwara diventa The Blue Brothers e nasce la coppia con Mario, uno che nella lega ha già cambiato nome tre volte. E resta una domanda: se vincono, chi dei due porta il trofeo a casa?"],
 "Mario":["L'Uomo dai Quattro Nomi","Comincia come Gingleton, con la Lil plug, e il debutto del 2021/22 è il più duro: 8° e ultimo con 31 punti. Poi cambia nome e squadra, diventa Barny con lo Stortenham e trova il suo momento migliore: 3° nel 2022/23, sul podio, e 8° nel 2023/24 con 48 punti, il calo che spesso arriva dopo il picco. Cambia ancora, stavolta in Pep Mariola con il Dynamo Loska, e si stabilizza a centro classifica: 7° nel 2024/25 con 40 punti e 7° ancora nel 2025/26 con 48. Nel 2026/27 cambia di nuovo tutto, nome, squadra e compagnia: Mario, in coppia con Leanzino alla The Blue Brothers, la Mugiwara che riparte dall'8° posto. Quattro nomi in cinque stagioni, un podio nel curriculum e un debutto da dimenticare: se il passato conta, il socio di Leanzino sa già come si risale."],

function percorso(name){
  var R=[];
  STORICO.slice().reverse().forEach(function(e){
    if(!e.t)return;
    e.t.forEach(function(r,i){if(can(r[1])===name)R.push({y:e.y,c:e.c,t:r[0],p:i+1,pt:r[2],v:can(e.v[1])===name})});
  });
  return R;
}
function titoli(name){return STORICO.filter(function(e){return can(e.v[1])===name}).length+(window.NOV&&NOV.pre?NOV.pre.filter(function(x){return x[2]===name}).length:0)}
function scontri(name){
  var K={};
  function k(o){return K[o]||(K[o]={dav:0,die:0,v:0,n:0,p:0})}
  STORICO.forEach(function(e){
    if(!e.t||e.fin)return;var me=-1;
    e.t.forEach(function(r,i){if(can(r[1])===name)me=i});
    if(me<0)return;
    e.t.forEach(function(r,i){var o=can(r[1]);if(o===name)return;var x=k(o);if(me<i)x.dav++;else x.die++});
  });
  var T=CUR[name];
  if(T&&D){
    var TC={};Object.keys(CUR).forEach(function(c){if(c!=='Mario')TC[CUR[c].toLowerCase()]=c});
    function add(a,b,ga,gb){
      var me=a.toLowerCase()===T.toLowerCase(),yo=b.toLowerCase()===T.toLowerCase();
      if(!me&&!yo)return;var opp=me?b:a,o=TC[opp.toLowerCase()];if(!o||CUR[o]===T)return;
      var x=k(o),f=me?ga:gb,s=me?gb:ga;if(f>s)x.v++;else if(f===s)x.n++;else x.p++;
    }
    D.cal.lega.forEach(function(g){g.m.forEach(function(m){if(m[4]==='-')return;var s=m[4].split('-').map(Number);add(m[0],m[3],s[0],s[1])})});
    D.cal.cup.forEach(function(g){g.m.forEach(function(m){if(m[5]==='-')return;var s=m[5].split('-').map(Number);add(m[1],m[4],s[0],s[1])})});
  }
  var L=Object.keys(K).filter(function(o){var x=K[o];return x.dav+x.die+x.v+x.n+x.p>0});
  L.sort(function(a,b){var x=K[a],y=K[b];return (y.dav+y.die+y.v+y.n+y.p)-(x.dav+x.die+x.v+x.n+x.p)||(a<b?-1:1)});
  if(!L.length)return '';
  var live=!!T,D3=function(a){return a.join('<span class="dsh">–</span>')};
  return '<h5>Scontri diretti</h5><table><tr><th style="text-align:left">Rivale</th><th>Classifiche<br>davanti<span class="dsh">–</span>dietro</th>'+(live?'<th>2026/27<br>V<span class="dsh">–</span>N<span class="dsh">–</span>P</th>':'')+'</tr>'
   +L.map(function(o){var x=K[o],cl=(x.dav+x.die)?D3([x.dav,x.die]):'–',st=(x.v+x.n+x.p)?D3([x.v,x.n,x.p]):'–';
     return '<tr><td style="text-align:left;font-weight:700">'+esc(lab(al(o)))+'</td><td>'+cl+'</td>'+(live?'<td>'+st+'</td>':'')+'</tr>'}).join('')+'</table>'
   +'';
}
function rivalita(name){
  var K={};function k(o){return K[o]||(K[o]={s:0,c:0,d:0,f:0,fx:''})}
  STORICO.forEach(function(e){
    if(e.fin){var a=can(e.fin[1]),b=can(e.fin[5]);if(a===name||b===name){var o=a===name?b:a,x=k(o);x.f++;x.fx=e.c+' '+e.y}return}
    if(!e.t)return;var me=-1;e.t.forEach(function(r,i){if(can(r[1])===name)me=i});if(me<0)return;
    e.t.forEach(function(r,i){var o=can(r[1]);if(o===name)return;var x=k(o),dd=Math.abs(i-me);x.s++;if(dd<=1)x.c+=1.5;else if(dd===2)x.c+=.5;if(dd===1&&Math.min(i,me)===0)x.d++})});
  var L=Object.keys(K).map(function(o){var x=K[o];return {o:o,x:x,sc:x.s*.8+x.c+x.d*3+x.f*4}}).filter(function(r){return r.sc>0}).sort(function(a,b){return b.sc-a.sc});
  if(!L.length)return '';
  var N=L.length;L=L.slice(0,8);
  var LV=[[3,'Poca','#3ddc84'],[6,'Moderata','#ffd23f'],[9,'Tanta','#ff9f1c'],[1e9,'Infuocata','#ff4d5e']];
  function lv(sc){for(var i=0;i<LV.length;i++)if(sc<LV[i][0])return LV[i]}
  var rows=L.map(function(r,i){var l=lv(r.sc),x=r.x,pct=Math.max(8,Math.min(100,Math.round(r.sc/12*100)));
    var why=x.f?'Finale '+x.fx:x.d?'Duello al vertice per il titolo':x.c>=3?'Spesso a pochi posti di distanza':x.s+(x.s>1?' stagioni':' stagione')+' insieme';
    return '<div class="rvr" style="--i:'+i+';--w:'+pct+'%;--cl:'+l[2]+'"><div class="rvt"><span>'+esc(lab(al(r.o)))+'</span><span class="rvl">'+l[1]+'</span></div><div class="rvbar"><i></i></div><small>'+esc(why)+'</small></div>'}).join('');
  var key='<div class="rvk">'+LV.map(function(l){return '<span style="--cl:'+l[2]+'">'+l[1]+'</span>'}).join('')+'</div>';
  return '<button class="rv-b" type="button" aria-expanded="false"><span>⚔️</span>Rivalità<small>'+(N>L.length?'Le '+L.length+' più accese':L.length+(L.length>1?' sfidanti':' sfidante'))+'</small><span class="rv-ch">›</span></button><div class="rv-p"><div class="rv-in">'+rows+key+'</div></div>';
}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.rv-b');if(!b)return;var p=b.nextElementSibling,on=!p.classList.contains('on');p.classList.toggle('on',on);b.setAttribute('aria-expanded',on?'true':'false')});
function scheda(name,ex){
  var c=CFG[name],R=percorso(name),T=titoli(name),st=STORIE[name];
  var tag=st?st[0]:'Ha Lasciato la Lega';
  var txt=st?st[1]:'Ha lasciato la lega, ma resta nell\'albo con quello che ha fatto.';
  var best=R.length?Math.min.apply(null,R.map(function(r){return r.p})):null;
  var c0=ex?CFGEX:(CFG[name]||CFGEX);
  var h='<div class="sh-top" style="--c1:'+c0.bg[0]+';--c2:'+c0.bg[1]+';'+(ex?'':bnr(name))+'"><div class="sh-tx"><div class="sh-tag">'+esc(tag)+'</div><div class="sh-nome">'+esc(lab(al(name)))+(FORMER[name]?' <span class="fm">Formerly '+esc(FORMER[name])+'</span>':'')+'</div><div class="sub">'+(CUR[name]?'Oggi: '+esc(CUR[name]):'Fuori dalla lega')+'</div></div><div class="sh-av">'+av(name,128,ex)+'</div></div>';
  h+='<div class="kp"><div><small>Titoli</small><b>'+T+'</b></div><div><small>Stagioni</small><b>'+R.length+'</b></div><div><small>Miglior piazzamento</small><b>'+(best?best+'°':'–')+'</b></div><div><small>Posizione media</small><b>'+(R.length?(Math.round(R.reduce(function(a,r){return a+r.p},0)/R.length*10)/10+'').replace('.',',')+'°':'–')+'</b></div></div>';
  h+='<p class="sh-st sh-sto">'+esc(txt)+'</p>';
  if(AMB[name])h+='<h5>Dove punta <span class="fm">(previsione dai dati)</span></h5><p class="sh-st" style="margin-top:4px">'+esc(AMB[name])+'</p>';
  if(R.length)h+='<h5>Il percorso</h5><table><tr><th style="text-align:left">Stagione</th><th style="text-align:left">Squadra</th><th>Pos.</th><th>Punti</th></tr>'+R.map(function(r){return '<tr><td style="text-align:left">'+r.y+'<small>'+esc(r.c)+'</small></td><td style="text-align:left;font-weight:700">'+esc(r.t)+'</td><td>'+(r.v?'🏆 ':'')+r.p+'°</td><td>'+(r.pt!=null?r.pt:'–')+'</td></tr>'}).join('')+'</table>';
  h+=rivalita(name);
  h+=scontri(name);
  return h;
}
function stato(){
  return '<div class="card"><div class="sub" style="margin:0">Stagione 2026/27 · Campionato: giocata la '+lastN(D.cal.lega,false)+'ª giornata · Champions Cup: '+(lastN(D.cal.cup,true)?(lastN(D.cal.cup,true)===1?'giocata 1 giornata su ':'giocate '+lastN(D.cal.cup,true)+' giornate su ')+D.cal.cup.length:'parte alla prossima giornata')+'</div></div>';

function allenatori(){
  var cur=ORD.slice().sort(function(a,b){return titoli(b)-titoli(a)||ORD.indexOf(a)-ORD.indexOf(b)});
  var ex={};STORICO.forEach(function(e){if(!e.t)return;e.t.forEach(function(r){var n=can(r[1]);if(!CFG[n])ex[n]=1})});
  if(window.NOV&&NOV.pre)NOV.pre.forEach(function(x){if(x[2]&&!CFG[can(x[2])])ex[can(x[2])]=1});var exl=Object.keys(ex).sort(function(a,b){return titoli(b)-titoli(a)||(a<b?-1:1)});
  var h='<h3 class="hh">Gli allenatori</h3><div class="cg">'+cur.map(function(n){var t=titoli(n);
    return '<button class="cb" data-co="'+esc(n)+'">'+av(n,84)+'<b>'+esc(n)+'</b><small>'+(t?'🏆 '.repeat(Math.min(t,3))+t+(t===1?' titolo':' titoli'):esc(CUR[n]))+'</small></button>'}).join('')+'</div>';
  h+='<h3 class="hh" style="margin-top:20px">Chi ha lasciato</h3><div class="cg ex">'+exl.map(function(n){var t=titoli(n);

}

  var m=document.getElementById('mo');
  if(!m){m=document.createElement('div');m.id='mo';m.className='mo';document.body.appendChild(m);
