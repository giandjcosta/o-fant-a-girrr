<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Totogirrr · O Girrr</title>
<link rel="icon" type="image/png" href="../assets/favicon-64.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap">
<style>
:root{--acc:#d62839;--bg:#1d2a52;--bg2:#2c3f7c;--bg3:#141d3d;--chiaro:#fbf6ec;--hi:#ffd166;--sub:#bfe3ff;--az:#3d93d6;--ok:#4ade80;--ko:#ff6b7a}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--chiaro);background:var(--bg);
 background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 36px,transparent 36px 72px),radial-gradient(1200px 700px at 80% -10%,var(--bg2) 0,var(--bg) 55%,var(--bg3) 100%);background-attachment:fixed}
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 150px}
a{color:var(--hi)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.top img{height:46px}
.top .t{flex:1;min-width:0}
.top .k{font-weight:900;font-size:10px;letter-spacing:.32em;color:var(--hi)}
.top h1{font-weight:900;font-size:30px;line-height:1;letter-spacing:-.01em}
.top h1 span{color:var(--hi)}
.bal{text-align:right;background:rgba(255,255,255,.1);border-radius:12px;padding:6px 12px;border-left:5px solid var(--hi)}
.bal small{display:block;font-weight:800;font-size:9px;letter-spacing:.22em;color:var(--sub)}
.bal b{font-weight:900;font-size:22px;line-height:1.1}
.back{display:inline-block;margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:.14em;text-decoration:none;color:var(--sub)}
.who{font-size:12px;color:var(--sub);margin-bottom:10px}
.who button{margin-left:6px}
nav{display:flex;gap:6px;margin-bottom:14px;position:sticky;top:0;z-index:5;padding:6px 0;background:linear-gradient(var(--bg) 70%,transparent)}
nav button{flex:1;font:900 12px Inter;letter-spacing:.1em;text-transform:uppercase;padding:10px 4px;border:0;border-radius:10px;background:rgba(255,255,255,.1);color:var(--chiaro);cursor:pointer}
nav button.on{background:var(--hi);color:var(--bg)}
button{font-family:inherit;cursor:pointer}
.card{background:rgba(255,255,255,.08);border-radius:14px;padding:14px;margin-bottom:12px}
.gh{font-weight:900;font-size:12px;letter-spacing:.2em;color:var(--hi);margin:18px 2px 8px;display:flex;justify-content:space-between;gap:8px}
.gh.cup{color:var(--sub)}
.gh small{font-weight:700;letter-spacing:.04em;color:var(--sub);text-align:right}
.m .nm{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:15px;margin-bottom:10px}
.m .nm span{min-width:0;overflow-wrap:anywhere}
.m .nm i{font-style:normal;color:var(--sub);font-weight:600;flex:none}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.row.two{grid-template-columns:repeat(2,1fr)}
.q{border:2px solid rgba(255,255,255,.18);background:rgba(0,0,0,.18);color:var(--chiaro);border-radius:10px;padding:7px 4px;line-height:1.15}
.q small{display:block;font-weight:700;font-size:10px;letter-spacing:.1em;color:var(--sub)}
.q b{font-weight:900;font-size:18px}
.q.on{background:var(--hi);color:var(--bg);border-color:var(--hi)}
.q.on small{color:var(--bg)}
.q:disabled{opacity:.4;cursor:not-allowed}
.chiusa{font-size:12px;color:var(--sub);font-weight:700}
.res{font-weight:900;font-size:20px;color:var(--hi)}
.slip{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg3);border-top:3px solid var(--hi);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 26px rgba(0,0,0,.45)}
.slip .in{max-width:860px;margin:0 auto}
.slip .sel{font-size:12px;color:var(--sub);margin-bottom:6px;max-height:84px;overflow:auto}
.slip .sel div{display:flex;justify-content:space-between;gap:8px}
.slip .sel b{color:var(--chiaro)}
.slip .ln{display:flex;gap:8px;align-items:center}
.slip input{width:92px;font:900 17px Inter;padding:9px;border-radius:10px;border:2px solid var(--hi);background:var(--bg);color:var(--chiaro)}
.slip .info{flex:1;font-size:12px;color:var(--sub);line-height:1.3}
.slip .info b{color:var(--hi);font-size:16px}
.go{font:900 13px Inter;letter-spacing:.14em;text-transform:uppercase;padding:12px 14px;border:0;border-radius:10px;background:var(--acc);color:#fff}
.go:disabled{opacity:.5}
.x{border:0;background:transparent;color:var(--sub);font-weight:800;font-size:12px;text-decoration:underline}
.chips{display:flex;gap:6px;margin-top:6px}
.chips button{border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--chiaro);border-radius:999px;font-weight:800;font-size:11px;padding:4px 10px}
.bet .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800}
.tag{font-weight:900;font-size:10px;letter-spacing:.16em;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.15)}
.tag.vinta{background:var(--ok);color:#052e16}.tag.persa{background:var(--ko);color:#4c0519}
.bet ul{list-style:none;margin-top:8px;font-size:13px;color:var(--sub)}
.bet li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.bet li.v{color:var(--ok)}.bet li.p{color:var(--ko)}
.lb{width:100%;border-collapse:collapse;font-size:14px}
.lb td,.lb th{padding:9px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,.1)}
.lb th{font-size:10px;letter-spacing:.2em;color:var(--sub)}
.lb td:last-child,.lb th:last-child{text-align:right}
.lb tr.me{background:rgba(255,209,102,.14)}
.lb .n{width:26px;font-weight:900;color:var(--hi)}
.gate{max-width:420px;margin:8vh auto 0;text-align:center}
.gate img{height:120px;margin-bottom:6px}
.gate h1{font-weight:900;font-size:44px;letter-spacing:-.02em}
.gate h1 span{color:var(--hi)}
.gate p{color:var(--sub);font-weight:600;margin:8px 0 18px;line-height:1.4}
.gate select,.gate input{width:100%;font:700 16px Inter;padding:13px;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:var(--chiaro);margin-bottom:10px}
.gate .go{width:100%;padding:14px}
.err{color:var(--ko);font-weight:700;font-size:13px;margin-top:8px;min-height:18px}
.regole{font-size:13px;line-height:1.55;color:var(--sub)}
.regole b{color:var(--chiaro)}
.regole li{margin:6px 0 6px 18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:130px;z-index:20;background:var(--hi);color:var(--bg);font-weight:900;padding:10px 16px;border-radius:12px;box-shadow:0 8px 22px rgba(0,0,0,.4);max-width:92vw;text-align:center}
.toast.bad{background:var(--ko);color:#fff}
.vuoto{text-align:center;color:var(--sub);padding:26px 8px;font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
var URL_='https://qmjqfgmvimsuxvghetgi.supabase.co',KEY='sb_publishable_qPhimkrF4iUvIad7JPoH8A_i-eOqG7n';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function f2(n){return Number(n).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})}
function f0(n){return Number(n).toLocaleString('it-IT',{maximumFractionDigits:0})}
var LS={};try{LS=JSON.parse(localStorage.getItem('fg')||'{}')||{}}catch(e){}
function save(){try{localStorage.setItem('fg',JSON.stringify(LS))}catch(e){}}
var teams=[],team=LS.team||'',code=LS.code||'',S=null,tab='partite',slip=[],err='',busy=false;
var MN={'1':'1','X':'X','2':'2','O':'Over 4,5','U':'Under 4,5'};

function rpc(name,body){
  return fetch(URL_+'/rest/v1/rpc/'+name,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)})
   .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j&&j.message?j.message:'Errore di rete');return j})});
}
function toast(t,bad){var d=document.createElement('div');d.className='toast'+(bad?' bad':'');d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},3200)}
function quando(iso){try{return new Intl.DateTimeFormat('it-IT',{weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Rome'}).format(new Date(iso))}catch(e){return iso}}

function carica(){
  busy=true;
  return rpc('toto_stato',{p_team:team,p_code:code}).then(function(s){S=s;err='';busy=false;
    // tolgo dalla schedina le partite che nel frattempo si sono chiuse
    slip=slip.filter(function(x){var p=pm(x.p);return p&&!p.chiusa&&new Date(p.chiude)>new Date()});
    render()}).catch(function(e){busy=false;S=null;err=e.message;if(/Codice/.test(err)){LS.code='';code='';save()}render()});
}
function pm(id){return S&&S.partite.filter(function(p){return p.id===id})[0]}
function quotaDi(p,m){return Number({'1':p.q1,'X':p.qx,'2':p.q2,'O':p.qo,'U':p.qu}[m])}
function aperta(p){return !p.chiusa&&new Date(p.chiude)>new Date()}

function gate(){
  var o=teams.map(function(t){return '<option'+(t===team?' selected':'')+'>'+esc(t)+'</option>'}).join('');
  return '<div class="gate"><img src="../assets/logo-lega.png" alt=""><h1>Toto<span>girrr</span></h1><p>Le scommesse della lega, con fantacrediti finti. Entra con il codice della tua squadra, lo stesso del Spogliatoio.</p>'+
  '<select id="gt">'+o+'</select><input id="gc" placeholder="Codice squadra" autocomplete="off" autocapitalize="characters" value="'+esc(code)+'"><button class="go" id="enter">Entra</button><div class="err">'+esc(err)+'</div><p style="margin-top:22px"><a href="index.html">‹ Torna a O Girrr</a></p></div>';
}
function head(){
  var c=S.conto;
  return '<a class="back" href="index.html">‹ O GIRRR</a><div class="top"><img src="../assets/logo-lega.png" alt=""><div class="t"><div class="k">O FANT A GIRRR</div><h1>Toto<span>girrr</span></h1></div><div class="bal"><small>FANTACREDITI</small><b>'+f2(c.crediti)+'</b></div></div>'+
  '<div class="who">Squadra: <b>'+esc(team)+'</b><button class="x" id="out">Esci</button></div>'+
  '<nav>'+[['partite','Partite'],['mie','Le mie'],['class','Classifica'],['regole','Regole']].map(function(t){return '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</nav>';
}
function qbtn(p,m){
  var on=slip.some(function(x){return x.p===p.id&&x.m===m}),lab={'1':'1','X':'X','2':'2','O':'Over 4,5','U':'Under 4,5'}[m];
  return '<button class="q'+(on?' on':'')+'" data-p="'+p.id+'" data-m="'+m+'"'+(aperta(p)?'':' disabled')+'><small>'+lab+'</small><b>'+f2(quotaDi(p,m))+'</b></button>';
}
function vPartite(){
  var gr={},ord=[];S.partite.forEach(function(p){var k=p.comp+'|'+p.giornata;if(!gr[k]){gr[k]=[];ord.push(k)}gr[k].push(p)});
  if(!ord.length)return '<div class="vuoto">Nessuna partita in lavagna per ora. Le quote escono appena si sa quando inizia la giornata.</div>';
  return ord.map(function(k){
    var a=gr[k],p0=a[0],cup=p0.comp==='coppa';
    var h='<div class="gh'+(cup?' cup':'')+'"><span>'+(cup?'CHAMPIONS CUP':'CAMPIONATO')+' · GIORNATA '+p0.giornata+'</span><small>Chiude '+quando(p0.chiude)+'</small></div>';
    return h+a.map(function(p){
      var body=p.chiusa?'<div class="res">'+p.gc+' – '+p.gt+' <span class="chiusa">finita</span></div>':
        '<div class="row">'+qbtn(p,'1')+qbtn(p,'X')+qbtn(p,'2')+'</div><div class="row two">'+qbtn(p,'O')+qbtn(p,'U')+'</div>'+(aperta(p)?'':'<div class="chiusa">Scommesse chiuse, si aspetta il risultato.</div>');
      return '<div class="card m"><div class="nm"><span>'+esc(p.casa)+' <i>vs</i> '+esc(p.trasf)+'</span></div>'+body+'</div>';
    }).join('');
  }).join('');
}
function etichetta(s){var p=pm(s.partita);return p?(esc(p.casa)+' – '+esc(p.trasf)):esc(s.partita)}
function vMie(){
  if(!S.schedine.length)return '<div class="vuoto">Non hai ancora giocato niente. Vai su Partite e scegli gli esiti.</div>';
  return S.schedine.map(function(s){
    var multi=s.sel.length>1;
    var lis=s.sel.map(function(x){return '<li class="'+(x.esito||'')+'"><span>'+etichetta(x)+' · <b>'+MN[x.mercato]+'</b></span><span>'+f2(x.quota)+'</span></li>'}).join('');
    var vin=s.stato==='vinta'?'Vinti '+f2(s.vincita):(s.stato==='aperta'?'Possibile vincita '+f2(s.puntata*s.quota):'Persa');
    return '<div class="card bet"><div class="h"><span>'+(multi?'Multipla ('+s.sel.length+')':'Singola')+' · '+f2(s.quota)+'</span><span class="tag '+s.stato+'">'+s.stato.toUpperCase()+'</span></div><ul>'+lis+'</ul><div style="margin-top:8px;font-size:13px;color:var(--sub)">Puntata <b style="color:var(--chiaro)">'+f2(s.puntata)+'</b> · '+vin+'</div></div>';
  }).join('');
}
function vClass(){
  var rows=S.classifica.map(function(c,i){var tot=Number(c.crediti)+Number(c.ingioco);
    return '<tr class="'+(c.team===team?'me':'')+'"><td class="n">'+(i+1)+'</td><td>'+esc(c.team)+'</td><td>'+f0(c.crediti)+'</td><td>'+f0(tot)+'</td></tr>'}).join('');
  return '<div class="card"><table class="lb"><tr><th></th><th>SQUADRA</th><th>LIBERI</th><th>TOTALE</th></tr>'+rows+'</table><p style="font-size:12px;color:var(--sub);margin-top:10px">Totale = fantacrediti liberi + quelli puntati su schedine ancora aperte. Chi non gioca non compare finché non entra la prima volta.</p></div>';
}
function vRegole(){
  var su=S.sussidio_ok?'<button class="go" id="suss" style="margin-top:12px">Prendi il sussidio (porta a 50)</button>':'';
  return '<div class="card regole"><b>Come funziona</b><ul><li>Si scommette solo con <b>fantacrediti</b>, soldi finti. Parti con <b>500</b>.</li><li>Scegli un esito (1 casa, X pari, 2 trasferta, Over/Under 4,5 gol totali) e premi su <b>Gioca</b>. Con più partite insieme fai una <b>multipla</b>: le quote si moltiplicano, ma devi indovinarle tutte (massimo 6).</li><li>Si può scommettere fino al <b>calcio d\'inizio della prima partita di Serie A</b> della giornata.</li><li>Puntata minima 5. Sulla <b>tua</b> partita il massimo è 100.</li><li>Le vincite arrivano da sole quando il risultato è in lega, di solito la mattina dopo.</li><li>Se scendi sotto i 50 fantacrediti puoi prendere il <b>sussidio</b>: ti riporta a 50, una volta a settimana.</li><li>Le quote nascono dalla forza delle squadre, con il banco che si tiene un po\' di margine. All\'inizio sono approssimative e migliorano giornata dopo giornata.</li></ul>'+su+'</div>';
}
function vSlip(){
  if(!slip.length||tab==='mie'&&0)return '';
  var q=1,sel=slip.map(function(x){var p=pm(x.p),qq=quotaDi(p,x.m);q*=qq;return '<div><span>'+esc(p.casa)+' – '+esc(p.trasf)+' · <b>'+MN[x.m]+'</b></span><span>'+f2(qq)+'</span></div>'}).join('');
  q=Math.min(500,Math.round(q*100)/100);
  var st=Number(LS.puntata||10);
  return '<div class="slip"><div class="in"><div class="sel">'+sel+'</div><div class="ln"><input id="stake" type="number" inputmode="decimal" min="5" step="1" value="'+st+'"><div class="info">'+(slip.length>1?'Multipla ':'Singola ')+'· quota <b>'+f2(q)+'</b><br>Vincita <b id="win">'+f2(st*q)+'</b></div><button class="go" id="gioca"'+(busy?' disabled':'')+'>Gioca</button></div><div class="chips"><button data-st="10">10</button><button data-st="25">25</button><button data-st="50">50</button><button data-st="100">100</button><button class="x" id="svuota" style="margin-left:auto">Svuota</button></div></div></div>';
}
var QS=1;
function render(){
  var a=document.getElementById('app');
  if(!S){a.innerHTML=gate();return}
  var body=tab==='partite'?vPartite():tab==='mie'?vMie():tab==='class'?vClass():vRegole();
  var keep=document.getElementById('stake');
  a.innerHTML=head()+body+vSlip();
}
function setStake(v){LS.puntata=v;save();var s=document.getElementById('stake');if(s)s.value=v;upWin()}
function upWin(){
  var q=1;slip.forEach(function(x){q*=quotaDi(pm(x.p),x.m)});q=Math.min(500,Math.round(q*100)/100);
  var s=document.getElementById('stake'),w=document.getElementById('win');if(s&&w)w.textContent=f2((parseFloat(s.value)||0)*q);
}
document.addEventListener('click',function(e){
  var t=e.target,b;
  if(t.id==='enter'){team=document.getElementById('gt').value;code=document.getElementById('gc').value.trim().toUpperCase();LS.team=team;LS.code=code;save();err='';document.querySelector('.err').textContent='Controllo…';carica();return}
  if(t.id==='out'){LS.code='';save();code='';S=null;slip=[];render();return}
  if(b=t.closest('[data-tab]')){tab=b.getAttribute('data-tab');render();window.scrollTo(0,0);return}
  if(b=t.closest('.q')){
    var id=b.getAttribute('data-p'),m=b.getAttribute('data-m');
    var i=slip.findIndex(function(x){return x.p===id});
    if(i>=0&&slip[i].m===m)slip.splice(i,1);else if(i>=0)slip[i].m=m;else{if(slip.length>=6){toast('Massimo 6 partite in una multipla',1);return}slip.push({p:id,m:m})}
    var y=window.scrollY;render();window.scrollTo(0,y);return}
  if(b=t.closest('[data-st]')){setStake(b.getAttribute('data-st'));return}
  if(t.id==='svuota'){slip=[];render();return}
  if(t.id==='suss'){rpc('toto_sussidio',{p_team:team,p_code:code}).then(function(){toast('Sussidio ricevuto: sei a 50');return carica()}).catch(function(e){toast(e.message,1)});return}
  if(t.id==='gioca'){
    var st=parseFloat(document.getElementById('stake').value);
    if(!(st>=5)){toast('Puntata minima 5',1);return}
    LS.puntata=st;save();busy=true;t.disabled=true;
    rpc('toto_gioca',{p_team:team,p_code:code,p_puntata:st,p_sel:slip.map(function(x){return{p:x.p,m:x.m}})})
     .then(function(r){toast('Giocata! Quota '+f2(r.quota)+', vincita possibile '+f2(r.vincita_possibile));slip=[];tab='mie';return carica()})
     .catch(function(e){busy=false;toast(e.message,1);render()});
  }
});
document.addEventListener('input',function(e){if(e.target.id==='stake')upWin()});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='gc')document.getElementById('enter').click()});

fetch('../data.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){teams=d.teams.map(function(t){return t.name});
  if(team&&code)carica();else render();
}).catch(function(){teams=['Oranje VC'];render()});
})();
</script>
</body>
</html>
