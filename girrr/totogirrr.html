<body>
<div class="wrap" id="app"></div>
<script>
(function(){
var URL_='https://qmjqfgmvimsuxvghetgi.supabase.co',KEY='sb_publishable_qPhimkrF4iUvIad7JPoH8A_i-eOqG7n';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function f2(n){return Number(n).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})}
function f0(n){return Number(n).toLocaleString('it-IT',{maximumFractionDigits:0})}
var LS={};try{LS=JSON.parse(localStorage.getItem('fg')||'{}')||{}}catch(e){}
function save(){try{localStorage.setItem('fg',JSON.stringify(LS))}catch(e){}}
var DEMO=/[?&]demo\b/.test(location.search);
var teams=[],team=DEMO?'Oranje VC':(LS.team||''),code=DEMO?'demo':(LS.code||''),S=null,tab='partite',slip=[],err='',busy=false;
var MN={'1':'1','X':'X','2':'2','O':'Over 4,5','U':'Under 4,5'};

var M=null;
function mockInit(){
  var t=Date.now()+3600e3,mk=function(i,c,tr,a,b,c2,d,e){return{id:'D'+i,comp:'lega',giornata:2,casa:c,trasf:tr,chiude:new Date(t).toISOString(),q1:a,qx:b,q2:c2,qo:d,qu:e,gc:null,gt:null,chiusa:false}};
  M={conto:{team:'Oranje VC',crediti:500,debito:0,ultimo_prestito:null},partite:[mk(1,'The Blue brothers','Mariana Coneja',2.55,6.15,1.83,1.67,2.0),mk(2,'AFA SELECCION','Real Madrink',2.21,6.27,2.05,1.59,2.12),mk(3,'Oranje VC','stif dc',1.59,6.71,3.12,1.54,2.22),mk(4,'Grodah','Atletico ma non troppo',2.05,5.46,2.33,1.99,1.67),mk(5,'WOA','Apo team',2.24,6.25,2.03,1.66,2.02)],schedine:[],n:0};
}
function mockStato(){
  var c=M.conto,lib=c.crediti<50&&!c.ultimo_prestito;
  return{ora:new Date().toISOString(),conto:c,sussidio_ok:lib,partite:M.partite,schedine:M.schedine.slice().reverse(),
   classifica:[{team:'Oranje VC',crediti:c.crediti,debito:c.debito,ingioco:M.schedine.filter(function(x){return x.stato==='aperta'}).reduce(function(a,x){return a+x.puntata},0)},{team:'stif dc',crediti:500,debito:0,ingioco:0},{team:'Grodah',crediti:500,debito:0,ingioco:0}]};
}
function mockRpc(name,b){
  if(!M)mockInit();
  if(name==='toto_stato')return mockStato();
  if(name==='toto_sussidio'){var d=50-M.conto.crediti;M.conto.crediti=50;M.conto.debito=Math.round(d*120)/100;M.conto.ultimo_prestito=1;return{crediti:50,dato:d,da_restituire:M.conto.debito}}
  if(name==='toto_gioca'){
    var st=b.p_puntata;if(!(st>=5))throw new Error('Puntata minima: 5 fantacrediti');if(st>M.conto.crediti)throw new Error('Fantacrediti insufficienti');
    var q=1,sel=b.p_sel.map(function(x){var p=M.partite.filter(function(y){return y.id===x.p})[0];if(p.casa==='Oranje VC'&&st>100)throw new Error('Sulla tua partita puntata massima 100');var qq=quotaDi(p,x.m);q*=qq;return{partita:p.id,mercato:x.m,quota:qq,esito:null}});
    q=Math.min(500,Math.round(q*100)/100);M.conto.crediti=Math.round((M.conto.crediti-st)*100)/100;
    M.schedine.push({id:++M.n,puntata:st,quota:q,stato:'aperta',vincita:0,creata:new Date().toISOString(),sel:sel});
    return{id:M.n,quota:q,vincita_possibile:Math.round(st*q*100)/100};
  }
  if(name==='demo_simula'){
    M.partite.forEach(function(p){if(!p.chiusa){p.gc=Math.floor(Math.random()*5);p.gt=Math.floor(Math.random()*5);p.chiusa=true}});
    M.schedine.forEach(function(s){if(s.stato!=='aperta')return;
      s.sel.forEach(function(x){var p=M.partite.filter(function(y){return y.id===x.partita})[0],tot=p.gc+p.gt;x.esito=((x.mercato==='1'&&p.gc>p.gt)||(x.mercato==='X'&&p.gc===p.gt)||(x.mercato==='2'&&p.gc<p.gt)||(x.mercato==='O'&&tot>=5)||(x.mercato==='U'&&tot<=4))?'v':'p'});
      if(s.sel.some(function(x){return x.esito==='p'}))s.stato='persa';
      else{var v=Math.round(s.puntata*s.quota*100)/100,tr=Math.min(M.conto.debito,Math.round(v*40)/100);s.stato='vinta';s.vincita=v;M.conto.crediti=Math.round((M.conto.crediti+v-tr)*100)/100;M.conto.debito=Math.round((M.conto.debito-tr)*100)/100}});
    return 1;
  }
}
function rpc(name,body){
  if(DEMO){try{return Promise.resolve(JSON.parse(JSON.stringify(mockRpc(name,body))))}catch(e){return Promise.reject(e)}}
  return fetch(URL_+'/rest/v1/rpc/'+name,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)})
   .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j&&j.message?j.message:'Errore di rete');return j})});
}
function toast(t,bad){var d=document.createElement('div');d.className='toast'+(bad?' bad':'');d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},3200)}
function quando(iso){try{var t=new Intl.DateTimeFormat('it-IT',{weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Rome'}).format(new Date(iso));return t.charAt(0).toUpperCase()+t.slice(1)}catch(e){return iso}}

function carica(){
  busy=true;
  return rpc('toto_stato',{p_team:team,p_code:code}).then(function(s){S=s;err='';busy=false;
    // tolgo dalla schedina le partite che nel frattempo si sono chiuse
    slip=slip.filter(function(x){var p=pm(x.p);return p&&!p.chiusa&&new Date(p.chiude)>new Date()});
    render()}).catch(function(e){busy=false;S=null;err=e.message;if(/Codice/.test(err)){LS.code='';code='';save()}render()});
}
function pm(id){return S&&S.partite.filter(function(p){return p.id===id})[0]}
function quotaDi(p,m){return Number({'1':p.q1,'X':p.qx,'2':p.q2,'O':p.qo,'U':p.qu}[m])}
function aperta(p){return !p.chiusa&&new Date(p.chiude)>new Date()}

function gate(){
  var o=teams.map(function(t){return '<option'+(t===team?' selected':'')+'>'+esc(t)+'</option>'}).join('');
  return '<div class="gate"><img src="../assets/logo-lega.png" alt=""><h1>Toto<span>girrr</span></h1><p>Le scommesse della lega, con fantacrediti finti. Entra con il codice della tua squadra, lo stesso del Spogliatoio.</p>'+
  '<select id="gt">'+o+'</select><input id="gc" placeholder="Codice squadra" autocomplete="off" autocapitalize="characters" value="'+esc(code)+'"><button class="go" id="enter">Entra</button><div class="err">'+esc(err)+'</div><p style="margin-top:22px"><a href="index.html">‹ Torna a O Girrr</a></p></div>';
}
function ticker(){
  var it=S.partite.map(function(p){return p.chiusa?'<span><b>'+esc(p.casa)+'</b> <i>'+p.gc+'–'+p.gt+'</i> <b>'+esc(p.trasf)+'</b></span>':'<span><b>'+esc(p.casa)+'</b> – <b>'+esc(p.trasf)+'</b> <i>'+f2(p.q1)+' · '+f2(p.qx)+' · '+f2(p.q2)+'</i></span>'}).join('');
  return it?'<div class="tick"><div class="tk">'+it+it+'</div></div>':'';
}
function evid(){
  var ap=S.partite.filter(aperta);if(!ap.length)return '';
  var fav=ap.map(function(p){var s1=p.q1<=p.q2;return{p:p,m:s1?'1':'2',q:s1?p.q1:p.q2,n:s1?p.casa:p.trasf}}).sort(function(a,b){return a.q-b.q}).slice(0,3);
  var used={};fav.forEach(function(x){used[x.p.id]=1});
  var col=ap.filter(function(p){return !used[p.id]}).map(function(p){var s1=p.q1>=p.q2;return{p:p,m:s1?'1':'2',q:s1?p.q1:p.q2,n:s1?p.casa:p.trasf}}).sort(function(a,b){return b.q-a.q}).slice(0,2);
  var cards=fav.map(function(x){return card(x,'FAVORITA')}).concat(col.map(function(x){return card(x,'COLPACCIO')})).join('');
  return '<div class="gh" style="margin-top:4px"><span>IN EVIDENZA</span></div><div class="feat">'+cards+'</div>';
}
function card(x,tag){
  var on=slip.some(function(y){return y.p===x.p.id&&y.m===x.m});
  return '<div class="fc"><div class="tg">'+tag+'</div><div class="mm">'+esc(x.p.casa)+' – '+esc(x.p.trasf)+'</div><button class="q'+(on?' on':'')+'" data-p="'+x.p.id+'" data-m="'+x.m+'"><small>'+esc(x.n)+'</small><b>'+f2(x.q)+'</b></button></div>';
}
function head(){
  var c=S.conto;
  return (DEMO?'<div class="card" style="border:2px dashed var(--hi);font-size:13px"><b style="color:var(--hi)">PROVA</b> · Qui è tutto finto e si azzera quando ricarichi. Gioca una schedina, poi premi il pulsante per far finire le partite a caso.<br><button class="go" id="sim" style="margin-top:10px">Fai finire le partite</button></div>':'')+'<a class="back" href="index.html">‹ O GIRRR</a><div class="top"><img src="../assets/logo-lega.png" alt=""><div class="t"><div class="k">O FANT A GIRRR</div><h1>Toto<span>girrr</span></h1></div><div class="bal"><small>FANTACREDITI</small><b>'+f2(c.crediti)+'</b>'+(Number(c.debito)>0?'<small style="color:var(--hi)">DEBITO '+f2(c.debito)+'</small>':'')+'</div></div>'+
  '<div class="who">Squadra: <b>'+esc(team)+'</b><button class="x" id="out">Esci</button></div>'+
  '<nav>'+[['partite','Partite'],['mie','Le mie'],['class','Classifica'],['regole','Regole']].map(function(t){return '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</nav>'+ticker();
}
function qbtn(p,m){
  var on=slip.some(function(x){return x.p===p.id&&x.m===m}),lab={'1':'1','X':'X','2':'2','O':'Over 4,5','U':'Under 4,5'}[m];
  return '<button class="q'+(on?' on':'')+'" data-p="'+p.id+'" data-m="'+m+'"'+(aperta(p)?'':' disabled')+'><small>'+lab+'</small><b>'+f2(quotaDi(p,m))+'</b></button>';
}
function hero(){
  var ap=S.partite.filter(aperta);if(!ap.length)return '';
  var g0=ap[0],gr=ap.filter(function(p){return p.comp===g0.comp&&p.giornata===g0.giornata});
  var mio=gr.filter(function(p){return p.casa===team||p.trasf===team})[0],pp=mio||gr[0];
  return '<div class="hero"><div class="hk">'+(g0.comp==='coppa'?'CHAMPIONS CUP':'CAMPIONATO')+' · GIORNATA '+g0.giornata+'</div><h2>Si chiude<br>tra <span class="cd" data-t="'+g0.chiude+'"></span></h2><p>'+gr.length+' partite aperte. Scegli gli esiti e gioca.</p>'+
   '<div class="mt"><small>'+(mio?'LA TUA PARTITA':'PRIMA PARTITA')+'</small><b>'+esc(pp.casa)+' – '+esc(pp.trasf)+'</b><div class="row">'+qbtn(pp,'1')+qbtn(pp,'X')+qbtn(pp,'2')+'</div></div></div>';
}
function vPartite(){
  var ev=hero()+evid();
  var gr={},ord=[];S.partite.forEach(function(p){var k=p.comp+'|'+p.giornata;if(!gr[k]){gr[k]=[];ord.push(k)}gr[k].push(p)});
  if(!ord.length)return '<div class="vuoto">Nessuna partita in lavagna per ora. Le quote escono appena si sa quando inizia la giornata.</div>';
  return ev+ord.map(function(k){
    var a=gr[k],p0=a[0],cup=p0.comp==='coppa';
    var h='<div class="gh'+(cup?' cup':'')+'"><span>'+(cup?'CHAMPIONS CUP':'CAMPIONATO')+' · GIORNATA '+p0.giornata+'</span><small title="'+quando(p0.chiude)+'" style="white-space:nowrap">'+(p0.chiusa||new Date(p0.chiude)<=new Date()?'Chiusa':'Chiude tra <span class="cd" data-t="'+p0.chiude+'"></span>')+'</small></div>';
    return h+a.map(function(p){
      var body=p.chiusa?'<div class="res">'+p.gc+' – '+p.gt+' <span class="chiusa">Finita</span></div>':
        '<div class="row">'+qbtn(p,'1')+qbtn(p,'X')+qbtn(p,'2')+'</div><div class="row two">'+qbtn(p,'O')+qbtn(p,'U')+'</div>'+(aperta(p)?'':'<div class="chiusa">Scommesse chiuse, si aspetta il risultato.</div>');
      return '<div class="card m"><div class="nm"><span>'+esc(p.casa)+' <i>vs</i> '+esc(p.trasf)+'</span></div>'+body+'</div>';
    }).join('');
  }).join('');
}
function etichetta(s){var p=pm(s.partita);return p?(esc(p.casa)+' – '+esc(p.trasf)):esc(s.partita)}
var OPEN={};
function esito(x){var p=pm(x.partita);return p&&p.chiusa?p.gc+'–'+p.gt:''}
function vMie(){
  if(!S.schedine.length)return '<div class="vuoto">Non hai ancora giocato niente. Vai su Partite e scegli gli esiti.</div>';
  return S.schedine.map(function(s){
    var multi=s.sel.length>1,az=s.sel.filter(function(x){return x.esito==='v'}).length,sb=s.sel.filter(function(x){return x.esito==='p'}).length,att=s.sel.length-az-sb;
    var lis=s.sel.map(function(x){var ic=x.esito==='v'?'✓':x.esito==='p'?'✗':'…',r=esito(x);
      return '<li class="'+(x.esito||'')+'"><span class="ic">'+ic+'</span><span class="tx">'+etichetta(x)+'<br><small>Hai giocato <b>'+MN[x.mercato]+'</b>'+(r?' · Finita '+r:(x.esito?'':' · In attesa'))+'</small></span><span>'+f2(x.quota)+'</span></li>'}).join('');
    var rs=s.stato==='vinta'?'Hai vinto '+f2(s.vincita)+' fantacrediti':s.stato==='persa'?'Hai perso '+f2(s.puntata)+' fantacrediti':'Possibile vincita '+f2(s.puntata*s.quota);
    var sum=s.stato==='aperta'?(az+' azzeccate · '+att+' in attesa'+(sb?' · '+sb+' sbagliate':'')):(az+' su '+s.sel.length+' azzeccate');
    var rig=s.sel.every(function(x){var p=pm(x.partita);return p&&aperta(p)})?'<br><button class="x rig" data-rig="'+s.id+'">Rigioca</button>':'';
    return '<details class="card bet" data-id="'+s.id+'"'+(OPEN[s.id]?' open':'')+'><summary><div class="h"><span>'+(multi?'Multipla ('+s.sel.length+')':'Singola')+' · '+f2(s.quota)+'</span><span class="tag '+s.stato+'">'+s.stato.toUpperCase()+'</span></div><div class="sm">Puntata <b>'+f2(s.puntata)+'</b> · '+sum+' <span class="ch">Dettagli ▾</span></div></summary><ul>'+lis+'</ul><div class="ft">'+rs+rig+'</div></details>';
  }).join('');
}
function vClass(){
  var rows=S.classifica.map(function(c,i){var tot=Number(c.crediti)+Number(c.ingioco)-Number(c.debito||0);
    return '<tr class="'+(c.team===team?'me':'')+'"><td class="n">'+(i+1)+'</td><td>'+esc(c.team)+'</td><td>'+f0(c.crediti)+'</td><td>'+f0(tot)+'</td></tr>'}).join('');
  return '<div class="card"><table class="lb"><tr><th></th><th>SQUADRA</th><th>LIBERI</th><th>TOTALE</th></tr>'+rows+'</table><p style="font-size:12px;color:var(--sub);margin-top:10px">Totale = fantacrediti liberi + quelli puntati su schedine ancora aperte − eventuali debiti col banco. Chi non gioca non compare finché non entra la prima volta.</p></div>';
}
function vRegole(){
  var su=S.sussidio_ok?'<button class="go" id="suss" style="margin-top:12px">Chiedi il prestito al banco (porta a 50)</button>':'';
  return '<div class="card regole"><b>Come funziona</b><ul><li>Si scommette solo con <b>fantacrediti</b>, soldi finti. Parti con <b>500</b>.</li><li>Scegli un esito (1 casa, X pari, 2 trasferta, Over/Under 4,5 gol totali) e premi su <b>Gioca</b>. Con più partite insieme fai una <b>multipla</b>: le quote si moltiplicano, ma devi indovinarle tutte (massimo 6).</li><li>Si può scommettere fino al <b>calcio d\'inizio della prima partita di Serie A</b> della giornata.</li><li>Puntata minima 5. Sulla <b>tua</b> partita il massimo è 100.</li><li>Le vincite arrivano da sole quando il risultato è in lega, di solito la mattina dopo.</li><li>Se scendi sotto i 50 fantacrediti puoi chiedere un <b>prestito al banco</b>: ti riporta a 50, ma una volta ogni due settimane. Il banco però vuole il <b>120%</b> indietro: sulle tue vincite si tiene il <b>40%</b> finché il debito non è saldato. Il debito conta in meno nella classifica.</li><li>Le quote nascono dalla forza delle squadre, con il banco che si tiene un po\' di margine. All\'inizio sono approssimative e migliorano giornata dopo giornata.</li></ul>'+su+'</div>';
}
function vSlip(){
  if(!slip.length||tab==='mie'&&0)return '';
  var q=1,sel=slip.map(function(x){var p=pm(x.p),qq=quotaDi(p,x.m);q*=qq;return '<div><span>'+esc(p.casa)+' – '+esc(p.trasf)+' · <b>'+MN[x.m]+'</b></span><span>'+f2(qq)+'</span></div>'}).join('');
  q=Math.min(500,Math.round(q*100)/100);
  var st=Number(LS.puntata||10);
  return '<div class="slip"><div class="in"><div class="sel">'+sel+'</div><div class="ln"><input id="stake" type="number" inputmode="decimal" min="5" step="1" value="'+st+'"><div class="info">'+(slip.length>1?'Multipla ':'Singola ')+'· quota <b>'+f2(q)+'</b><br>Vincita <b id="win">'+f2(st*q)+'</b></div><button class="go" id="gioca"'+(busy?' disabled':'')+'>Gioca</button></div><div class="chips"><button data-st="10">10</button><button data-st="25">25</button><button data-st="50">50</button><button data-st="100">100</button><button class="x" id="svuota" style="margin-left:auto">Svuota</button></div></div></div>';
}
var QS=1,ANIM=true,LASTQ='',SLIPWAS=false,BALPREV=null;
function render(){
  var a=document.getElementById('app');
  if(!S){a.innerHTML=gate();return}
  var body=tab==='partite'?vPartite():tab==='mie'?vMie():tab==='class'?vClass():vRegole();
  var keep=document.getElementById('stake');
  var hs=head(),sv=vSlip(),isNew=!!sv&&!SLIPWAS;SLIPWAS=!!sv;
  a.innerHTML=hs+'<div class="pane'+(ANIM?' an':'')+'">'+body+'</div>'+(isNew?sv.replace('class="slip"','class="slip new"'):sv);
  ANIM=false;
  if(LASTQ){var qb=a.querySelector('.q[data-p="'+LASTQ.split('|')[0]+'"][data-m="'+LASTQ.split('|')[1]+'"]');if(qb&&qb.classList.contains('on'))qb.classList.add('pop');LASTQ=''}
  var bb=document.querySelector('.bal b');if(bb&&S){var v=Number(S.conto.crediti);if(BALPREV!==null&&BALPREV!==v){var from=BALPREV,t0=performance.now();document.querySelector('.bal').classList.add('up');(function st(t){var k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);bb.textContent=f2(from+(v-from)*e);if(k<1)requestAnimationFrame(st)})(t0)}BALPREV=v}
}
function setStake(v){LS.puntata=v;save();var s=document.getElementById('stake');if(s)s.value=v;upWin()}
function upWin(){
  var q=1;slip.forEach(function(x){q*=quotaDi(pm(x.p),x.m)});q=Math.min(500,Math.round(q*100)/100);
  var s=document.getElementById('stake'),w=document.getElementById('win');if(s&&w)w.textContent=f2((parseFloat(s.value)||0)*q);
}
document.addEventListener('click',function(e){
  var t=e.target,b;
  if(t.id==='enter'){team=document.getElementById('gt').value;code=document.getElementById('gc').value.trim().toUpperCase();LS.team=team;LS.code=code;save();err='';document.querySelector('.err').textContent='Controllo…';carica();return}
  if(t.id==='sim'){rpc('demo_simula',{}).then(function(){slip=[];tab='mie';ANIM=true;toast('Partite finite, pagamenti fatti');return carica()});return}
  if(t.id==='out'){LS.code='';save();code='';S=null;slip=[];render();return}
  if(b=t.closest('[data-tab]')){tab=b.getAttribute('data-tab');ANIM=true;render();window.scrollTo(0,0);return}
  if(b=t.closest('.q')){
    var id=b.getAttribute('data-p'),m=b.getAttribute('data-m');
    var i=slip.findIndex(function(x){return x.p===id});
    if(i>=0&&slip[i].m===m)slip.splice(i,1);else if(i>=0)slip[i].m=m;else{if(slip.length>=6){toast('Massimo 6 partite in una multipla',1);return}slip.push({p:id,m:m})}
    LASTQ=id+'|'+m;var y=window.scrollY;render();window.scrollTo(0,y);return}
  if(b=t.closest('[data-st]')){setStake(b.getAttribute('data-st'));return}
  if(b=t.closest('[data-rig]')){var id2=Number(b.getAttribute('data-rig')),sc=S.schedine.filter(function(x){return x.id===id2})[0];if(sc){slip=sc.sel.map(function(x){return{p:x.partita,m:x.mercato}});tab='partite';ANIM=true;render();window.scrollTo(0,0);toast('Schedina ripresa: controlla la puntata e gioca')}return}
  if(t.id==='svuota'){slip=[];render();return}
  if(t.id==='suss'){rpc('toto_sussidio',{p_team:team,p_code:code}).then(function(r){toast('Prestito ricevuto: sei a 50, ne devi restituire '+f2(r.da_restituire));return carica()}).catch(function(e){toast(e.message,1)});return}
  if(t.id==='gioca'){
    var st=parseFloat(document.getElementById('stake').value);
    if(!(st>=5)){toast('Puntata minima 5',1);return}
    LS.puntata=st;save();busy=true;t.disabled=true;
    rpc('toto_gioca',{p_team:team,p_code:code,p_puntata:st,p_sel:slip.map(function(x){return{p:x.p,m:x.m}})})
     .then(function(r){toast('Giocata! Quota '+f2(r.quota)+', vincita possibile '+f2(r.vincita_possibile));slip=[];tab='mie';ANIM=true;return carica()})
     .catch(function(e){busy=false;toast(e.message,1);render()});
  }
});
document.addEventListener('toggle',function(e){var d=e.target;if(d&&d.classList&&d.classList.contains('bet')){OPEN[d.getAttribute('data-id')]=d.open}},true);
document.addEventListener('input',function(e){if(e.target.id==='stake')upWin()});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='gc')document.getElementById('enter').click()});

function fmtCd(ms){var s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d>0?d+'g '+h+'h':h>0?h+'h '+m+'m':m+'m '+String(s%60).padStart(2,'0')+'s'}
setInterval(function(){document.querySelectorAll('.cd').forEach(function(e){var ms=new Date(e.getAttribute('data-t'))-Date.now();if(ms<=0){if(!e.dataset.done){e.dataset.done=1;e.textContent='0s';if(S&&!busy)carica()}return}e.textContent=fmtCd(ms);e.className='cd'+(ms<3600e3?' hot':ms<86400e3?' warn':'')})},1000);
fetch('../data.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){teams=d.teams.map(function(t){return t.name});
  if(team&&code)carica();else render();
}).catch(function(){teams=['Oranje VC'];render()});
})();
</script>
</body>
