*{box-sizing:border-box}

/* Bordo = squadra, uguale nelle due grafiche: casa azzurro, ospite bianco (il rosso sparirebbe sui voti bassi). Il migliore in campo ha la stella, mai un bordo oro. */
body{--casa:#63bce9}
.pitch .pl.away b{border-color:#f5f6fb}
