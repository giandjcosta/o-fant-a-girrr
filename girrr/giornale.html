<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>O Giornale del Girrr · Archivio</title>
<link rel="icon" type="image/png" href="../assets/favicon-64.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap">
<style>
:root{--acc:#d62839;--bg:#1d2a52;--bg2:#2c3f7c;--bg3:#141d3d;--chiaro:#fbf6ec;--hi:#ffd166;--sub:#bfe3ff}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--chiaro);background:var(--bg);
 background-image:radial-gradient(1200px 700px at 80% -10%,var(--bg2) 0,var(--bg) 55%,var(--bg3) 100%);background-attachment:fixed}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 36px}
.back{display:inline-block;margin-bottom:10px;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--hi);text-decoration:none}
.top{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.top img{height:clamp(70px,13vw,110px)}
.kick{font-weight:900;font-size:13px;letter-spacing:.4em;color:var(--hi)}
h1{font-family:'DejaVu Serif',Georgia,serif;font-weight:700;font-size:clamp(26px,5vw,44px);line-height:1.05;margin-top:4px}
h1 span{color:var(--acc);filter:brightness(1.25)}
.sub{margin-top:6px;color:var(--sub);font-weight:600;font-size:15px}
.last{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:22px;background:rgba(255,255,255,.08);border-left:8px solid var(--acc);border-radius:4px 16px 16px 4px;padding:18px;margin-bottom:26px}
@media(max-width:700px){.last{grid-template-columns:1fr}}
.cv{display:block;border-radius:6px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.45);transition:transform .25s}
.cv:hover{transform:translateY(-4px) rotate(-.6deg)}
.cv img{display:block;width:100%;height:auto;background:#f3eee1}
.num{font-weight:900;font-size:13px;letter-spacing:.3em;color:var(--hi)}
.last h2{font-size:clamp(22px,3.6vw,34px);line-height:1.1;font-weight:900;margin:6px 0 8px;text-transform:uppercase}
.last p{color:var(--sub);line-height:1.5;margin-bottom:14px}
.btn{display:inline-block;background:var(--acc);color:#fff;text-decoration:none;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:14px;padding:12px 18px;border-radius:999px;margin-right:8px}
.btn.o{background:rgba(255,255,255,.14)}
h3{font-weight:900;font-size:14px;letter-spacing:.34em;color:var(--hi);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.it{display:block;text-decoration:none;color:inherit;background:rgba(255,255,255,.07);border-radius:12px;padding:12px;transition:transform .2s,background .2s}
.it:hover{transform:translateY(-4px);background:rgba(255,255,255,.12)}
.it img{display:block;width:100%;border-radius:4px;background:#f3eee1;box-shadow:0 8px 18px rgba(0,0,0,.4)}
.it b{display:block;margin-top:10px;font-weight:900;font-size:13px;letter-spacing:.2em;color:var(--hi)}
.it span{display:block;margin-top:4px;font-weight:700;font-size:14px;line-height:1.3}
.it small{display:block;margin-top:4px;color:var(--sub);font-size:12px}
.empty{padding:30px;text-align:center;color:var(--sub);font-weight:700}
body::before{content:'';position:fixed;inset:-120px;z-index:-1;pointer-events:none;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 36px,transparent 36px 72px);animation:strisce 9s linear infinite}
@keyframes strisce{to{transform:translate3d(79.45px,0,0)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">‹ O Girrr</a>
  <header class="top"><a href="index.html" title="Torna a O Girrr" style="display:block;flex:none"><img src="../assets/loghi/logo-lega-o-fant-a-girrr.png" alt="O Fant A Girrr" style="display:block"></a><div><div class="kick">ARCHIVIO</div><h1>O Giornale del <span>Girrr</span></h1><div class="sub">Tutti i numeri della stagione 2026/27, da aprire o scaricare</div></div></header>
  <div id="ultimo"></div>
  <h3 id="th" hidden>NUMERI PRECEDENTI</h3>
  <div class="grid" id="lista"></div>
</div>
<script>
fetch('../riepiloghi/indice.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(v){
  if(/[?&]demo\b/.test(location.search)&&v.length){var b=v[0],T=['Oranje VC dilaga: cinque gol e 89 punti','Il Mercato Scambi scuote la classifica','Derby di coppa: il girone A si accende','Real Madrink non si ferma più','Rimonta clamorosa all\'ultimo fantapunto','La WOA trova finalmente la vittoria','Pioggia di gol: record di giornata','Sorpasso in vetta, è un testa a testa'];v=T.map(function(t,i){var n=T.length-i,d=new Date(2026,9,9-7*i-0);return Object.assign({},b,{n:n,titolone:t,data:d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'})})})}
  function cap(s){s=String(s);return s.charAt(0).toUpperCase()+s.slice(1)}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  if(!v.length){document.getElementById('ultimo').innerHTML='<div class="empty">Il primo numero esce presto.</div>';return}
  var u=v[0];
  document.getElementById('ultimo').innerHTML='<div class="last"><a class="cv" href="../'+u.pdf+'" target="_blank" rel="noopener"><img src="../'+u.copertina+'" alt="Copertina numero '+u.n+'"></a><div><div class="num">NUMERO '+u.n+(u.data?' · '+esc(u.data).toUpperCase():'')+'</div><h2>'+esc(u.titolone||'Ultimo numero')+'</h2><p>'+esc(u.sommario||'')+'</p><a class="btn" href="../'+u.pdf+'" target="_blank" rel="noopener">Leggi il PDF</a><a class="btn o" href="../'+u.pdf+'" download>Scarica</a></div></div>';
  var rest=v.slice(1);
  if(rest.length){document.getElementById('th').hidden=false;
    document.getElementById('lista').innerHTML=rest.map(function(x){return '<a class="it" href="../'+x.pdf+'" target="_blank" rel="noopener"><img src="../'+x.copertina+'" alt=""><b>N° '+x.n+'</b><span>'+esc(x.titolone||'')+'</span><small>'+esc(cap(x.data||''))+'</small></a>'}).join('')}
}).catch(function(){document.getElementById('ultimo').innerHTML='<div class="empty">Non riesco a leggere l\'archivio.</div>'});
</script>
</body>
</html>
