<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Statistiche · O Girrr</title>
<link rel="icon" type="image/png" href="../assets/favicon-64.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#1d2a52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="O Girrr">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>
:root{--acc:#d62839;--bg:#1d2a52;--bg2:#2c3f7c;--bg3:#141d3d;--chiaro:#fbf6ec;--hi:#ffd166;--sub:#bfe3ff;--ok:#5fd38d;--bad:#ff7d86}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--chiaro);background:var(--bg);
 background-image:radial-gradient(1200px 700px at 80% -10%,var(--bg2) 0,var(--bg) 55%,var(--bg3) 100%);background-attachment:fixed}
body::before{content:'';position:fixed;inset:-120px;z-index:-1;pointer-events:none;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 36px,transparent 36px 72px);animation:strisce 9s linear infinite}
@keyframes strisce{to{transform:translate3d(79.45px,0,0)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 30px}
.back{display:inline-block;margin-bottom:10px;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--hi);text-decoration:none}
.top{display:flex;align-items:center;gap:16px}
.top img{height:clamp(70px,13vw,120px);cursor:pointer;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
.kick{font-weight:900;font-size:clamp(11px,1.6vw,14px);letter-spacing:.4em;color:var(--hi)}
h1{font-weight:900;font-size:clamp(26px,5vw,44px);line-height:1.05;margin-top:4px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:14px 2px 6px;margin-bottom:6px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border-radius:999px;border:2px solid transparent;background:rgba(255,255,255,.1);color:var(--chiaro);font:800 13px Inter;padding:9px 14px;cursor:pointer;opacity:.7;transition:all .25s}
.chips button.mia{border-color:rgba(255,209,102,.5)}
.chips button.sel{background:var(--acc);opacity:1;transform:scale(1.04)}
.swap{transition:opacity .22s ease,transform .22s ease}
.swap.out{opacity:0;transform:translateY(8px)}
.card{background:linear-gradient(150deg,rgba(255,255,255,.12),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:16px;margin-bottom:14px}
.card h3{font-weight:900;font-size:13px;letter-spacing:.3em;color:var(--hi);margin-bottom:10px;text-transform:uppercase}
.nome{font-weight:900;font-size:clamp(26px,5vw,40px);text-transform:uppercase;line-height:1.05}
.sub{color:var(--sub);font-weight:600;font-size:14px;margin-top:4px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:14px}
.kp div{background:rgba(0,0,0,.2);border-radius:12px;padding:10px 12px}
.kp small{display:block;font-weight:800;font-size:10px;letter-spacing:.2em;color:var(--sub);text-transform:uppercase}
.kp b{display:block;font-weight:900;font-size:24px;margin-top:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.ris{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.12);font-weight:700;font-size:14px}
.ris:last-child{border-bottom:0}
.ris .e{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;color:#10192f}
.e.v{background:var(--ok)}.e.n{background:var(--hi)}.e.p{background:var(--bad)}.e.d{background:rgba(255,255,255,.2);color:var(--chiaro)}
.ris small{display:block;color:var(--sub);font-weight:600;font-size:12px;margin-top:2px}
.ris .s{font-weight:900;font-size:17px;text-align:right}
.top5 .g{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12);font-weight:700;font-size:14px}
.top5 .g:last-child{border-bottom:0}.top5 small{color:var(--sub);font-weight:600}
.top5 b{font-weight:900;font-size:16px}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--hi));border-radius:6px;transition:width .6s ease}
table{width:100%;border-collapse:collapse;font-size:14px;font-weight:600}
th{font-size:10px;letter-spacing:.16em;color:var(--sub);text-align:right;padding:0 6px 6px;font-weight:800;text-transform:uppercase}
th:first-child{text-align:left}
td{padding:7px 6px;text-align:right;border-bottom:1px solid rgba(255,255,255,.1)}
td:first-child{text-align:left;font-weight:800}
td small{color:var(--sub);font-weight:600;display:block;font-size:11px}
.ruolo{font-weight:900;font-size:11px;letter-spacing:.3em;color:var(--hi);margin:14px 0 4px}
.vuoto{color:var(--sub);font-weight:600;font-size:14px}
.err{padding:30px;text-align:center;font-weight:700}
.foot{margin-top:14px;text-align:center;font-size:12px;color:var(--sub);opacity:.8}

.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi div{background:rgba(0,0,0,.22);border-radius:12px;padding:11px 12px}
.kpi small{display:block;font-weight:800;font-size:10px;letter-spacing:.18em;color:var(--sub);text-transform:uppercase}
.kpi b{display:block;font-weight:900;font-size:26px;margin-top:3px}
.hb{display:flex;align-items:center;gap:10px;margin:7px 0;font-weight:700;font-size:14px}
.hb span.l{flex:0 0 108px}.hb span.t{flex:1;min-width:0}.hb i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--hi));min-width:3px;transition:width .6s ease}.hb b{flex:0 0 34px;text-align:right;font-weight:900}
.cols{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:8px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.cols i{display:block;width:100%;border-radius:5px 5px 0 0;background:linear-gradient(0deg,var(--acc),var(--hi));min-height:2px;transition:height .6s ease}
.cols em{font-style:normal;font-weight:800;font-size:11px;margin-bottom:3px}
.cols small{font-size:10px;color:var(--sub);font-weight:700;margin-top:5px;white-space:nowrap}
.ore{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;height:90px;align-items:end}
.ore i{display:block;border-radius:3px 3px 0 0;background:linear-gradient(0deg,var(--acc),var(--hi));min-height:2px}
.orel{display:flex;justify-content:space-between;color:var(--sub);font-size:10px;font-weight:700;margin-top:4px}
.prova{border:2px dashed var(--hi);font-size:13px;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">‹ O Girrr</a>
  <header class="top"><img id="lg" src="../assets/loghi/logo-lega-o-fant-a-girrr.png" alt="O Fant A Girrr" title="Torna a O Girrr"><div><div class="kick">SOLO PER ORANJE VC</div><h1>Statistiche</h1></div></header>
  <div id="st" style="margin-top:16px"><div class="vuoto">Controllo l'accesso…</div></div>
  <div class="foot" id="foot">Conteggi anonimi: non si sa chi apre cosa, solo quante volte</div>
</div>
<script>
(function(){
var DEMO=/[?&]demo/.test(location.search);
var GC='https://djcosta18.goatcounter.com',GCK='1s9o7wb6xqvhg825f6xmz18syok8flp8kwga8fj8k2lsk4i4c',INIZIO='2026-10-10';
var SUP='https://qmjqfgmvimsuxvghetgi.supabase.co',SKEY='sb_publishable_qPhimkrF4iUvIad7JPoH8A_i-eOqG7n';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function f0(x){return Math.round(x).toLocaleString('it-IT')}
document.getElementById('lg').onclick=function(){location.href='index.html'};
function hshF(s){var h=2166136261,i;for(i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
var FG={};try{FG=JSON.parse(localStorage.getItem('fg')||'{}')||{}}catch(e){}
var SEZ=[['home','Home'],['spogliatoio','Spogliatoio'],['giornale','Giornale'],['tabellone','Tabellone'],['totogirrr','Totogirrr'],['squadre','Squadre'],['albo',"Albo d'oro"],['curva','Curva']];
function sezione(p){
  p=String(p||'').replace(/index\.html$/,'');
  if(/totogirrr\.html$/.test(p))return 'totogirrr';if(/giornale\.html$/.test(p))return 'giornale';if(/tabellone\.html$/.test(p))return 'tabellone';
  if(/squadre\.html$/.test(p))return 'squadre';if(/albo\.html$/.test(p))return 'albo';if(/curva\.html$/.test(p))return 'curva';
  if(/\/girrr\/$/.test(p))return 'home';if(/^\/o-fant-a-girrr\/$/.test(p)||p==='/')return 'spogliatoio';return null;
}
function demoHits(){
  var H=[],paths={'/o-fant-a-girrr/girrr/':40,'/o-fant-a-girrr/':25,'/o-fant-a-girrr/girrr/giornale.html':18,'/o-fant-a-girrr/girrr/tabellone.html':22,'/o-fant-a-girrr/girrr/totogirrr.html':35,'/o-fant-a-girrr/girrr/squadre.html':9,'/o-fant-a-girrr/girrr/albo.html':4,'giornale/pdf':14};
  Object.keys(paths).forEach(function(p){var st=[],tot=0;for(var d=6;d>=0;d--){var dt=new Date(Date.now()-d*864e5).toISOString().slice(0,10),h=[];for(var k=0;k<24;k++)h.push((k>=7&&k<=23)?Math.round(Math.random()*paths[p]/20*(k>17?2:1)):0);var n=h.reduce(function(a,b){return a+b},0);tot+=n;st.push({day:dt,hourly:h,daily:n})}H.push({path:p,count:tot,event:p.charAt(0)!=='/',stats:st})});
  return {hits:H};
}
function leggi(){
  if(DEMO)return Promise.resolve(demoHits());
  var e=new Date(Date.now()+864e5).toISOString().slice(0,10)+'T00:00:00Z';
  return fetch(GC+'/api/v0/stats/hits?start='+INIZIO+'T00:00:00Z&end='+e+'&limit=100',{headers:{Authorization:'Bearer '+GCK},cache:'no-store'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
}
function bar(l,v,m){return '<div class="hb"><span class="l">'+esc(l)+'</span><span class="t"><i style="width:'+Math.max(2,Math.round(v/Math.max(1,m)*100))+'%"></i></span><b>'+f0(v)+'</b></div>'}
function disegna(j){
  var el=document.getElementById('st');
  if(!j||!j.hits){el.innerHTML='<div class="card"><div class="vuoto">Non riesco a leggere i conteggi in questo momento. Riprova tra un attimo.</div></div>';return}
  var per={},pdf=0,days={},hrs=[],i;for(i=0;i<24;i++)hrs.push(0);
  SEZ.forEach(function(s){per[s[0]]=0});
  j.hits.forEach(function(h){
    var isPage=String(h.path).charAt(0)==='/'&&!h.event;
    if(h.path==='giornale/pdf'){pdf+=h.count||0;return}
    if(!isPage)return;var k=sezione(h.path);if(!k)return;per[k]+=h.count||0;
    (h.stats||[]).forEach(function(d){var n=(d.hourly||[]).reduce(function(a,b){return a+b},0);days[d.day]=(days[d.day]||0)+n;(d.hourly||[]).forEach(function(v,q){hrs[q]+=v})});
  });
  var tot=0;SEZ.forEach(function(s){tot+=per[s[0]]});
  var today=new Date().toISOString().slice(0,10),ks=Object.keys(days).sort();
  var d7=ks.filter(function(k){return k<=today}).slice(-7).reduce(function(a,k){return a+days[k]},0);
  var top=SEZ.slice().sort(function(a,b){return per[b[0]]-per[a[0]]})[0];
  var h='';
  h+='<div class="card"><h3>In sintesi</h3><div class="kpi"><div><small>Visite totali</small><b>'+f0(tot)+'</b></div><div><small>Oggi</small><b>'+f0(days[today]||0)+'</b></div><div><small>Ultimi 7 giorni</small><b>'+f0(d7)+'</b></div><div><small>Più visitata</small><b style="font-size:19px;margin-top:8px">'+(tot?esc(top[1]):'–')+'</b></div><div><small>Giornali aperti</small><b>'+f0(pdf)+'</b></div></div></div>';
  /* giorni */
  var last=[];for(i=13;i>=0;i--)last.push(new Date(Date.now()-i*864e5).toISOString().slice(0,10));
  var mx=Math.max.apply(null,last.map(function(k){return days[k]||0}).concat([1]));
  h+='<div class="card"><h3>Visite al giorno</h3><div class="cols">'+last.map(function(k){var n=days[k]||0,dt=new Date(k+'T12:00:00Z');return '<div><em>'+(n||'')+'</em><i style="height:'+Math.round(n/mx*100)+'%"></i><small>'+dt.getUTCDate()+'/'+(dt.getUTCMonth()+1)+'</small></div>'}).join('')+'</div></div>';
  /* sezioni */
  var m2=Math.max.apply(null,SEZ.map(function(s){return per[s[0]]}).concat([1]));
  h+='<div class="card"><h3>Dove si entra di più</h3>'+SEZ.slice().sort(function(a,b){return per[b[0]]-per[a[0]]}).map(function(s){return bar(s[1],per[s[0]],m2)}).join('')+'</div>';
  /* ore */
  var off=new Date().getTimezoneOffset()/60,loc=[];for(i=0;i<24;i++)loc.push(0);
  hrs.forEach(function(v,q){var l=((q-off)%24+24)%24;loc[Math.floor(l)]+=v});
  var mh=Math.max.apply(null,loc.concat([1])),best=0;for(i=1;i<24;i++)if(loc[i]>loc[best])best=i;
  h+='<div class="card"><h3>A che ora si entra</h3><div class="ore">'+loc.map(function(v){return '<i style="height:'+Math.max(3,Math.round(v/mh*100))+'%" title="'+v+'"></i>'}).join('')+'</div><div class="orel"><span>0</span><span>6</span><span>12</span><span>18</span><span>23</span></div>'+(tot?'<div class="sub" style="margin-top:8px">L\'ora più frequente è '+String(best).padStart(2,'0')+':00 (ora dei tuoi dispositivi).</div>':'')+'</div>';
  h+='<div class="card"><div class="vuoto">I conteggi partono dal 10 ottobre. Nello Spogliatoio c\'è anche la scheda Statistiche con le aperture per scheda. Per paesi, browser e sistemi: <a style="color:var(--hi)" href="'+GC+'" target="_blank" rel="noopener">le statistiche complete</a>.</div></div>';
  var ev={};j.hits.forEach(function(x){if(x.event&&/^curva\//.test(x.path))ev[x.path]=(ev[x.path]||0)+(x.count||0)});
  el.innerHTML=h+'<div id="cvs"></div><div id="tt"></div>';
  curvaStat(ev);totogirrr();
}
function curvaStat(ev){
  var box=document.getElementById('cvs');if(!box)return;
  if(DEMO){draw({posts:[{team:'Oranje VC'},{team:'Grodah'},{team:'Grodah'},{team:'WOA'}],replies:[{team:'Grodah'},{team:'Oranje VC'}],react:[{n:5},{n:3}]});return}
  fetch(SUP+'/rest/v1/rpc/curva_feed',{method:'POST',headers:{apikey:SKEY,Authorization:'Bearer '+SKEY,'Content-Type':'application/json'},body:'{}'}).then(function(r){return r.ok?r.json():null}).then(function(f){if(f)draw(f)}).catch(function(){});
  function draw(f){
    var pt={},n;f.posts.forEach(function(p){pt[p.team]=(pt[p.team]||0)+1});f.replies.forEach(function(p){pt[p.team]=(pt[p.team]||0)+1});
    var rows=Object.keys(pt).map(function(k){return[k,pt[k]]}).sort(function(a,b){return b[1]-a[1]}),m=rows.length?rows[0][1]:1,rea=f.react.reduce(function(a,r){return a+Number(r.n)},0);
    box.innerHTML='<div class="card"><h3>Curva</h3><div class="kpi" style="margin-bottom:12px"><div><small>Cori</small><b>'+f0(f.posts.length)+'</b></div><div><small>Risposte</small><b>'+f0(f.replies.length)+'</b></div><div><small>Applausi e rilanci</small><b>'+f0(rea)+'</b></div></div>'+
      (rows.length?'<div class="vuoto" style="text-align:left;margin-bottom:6px">Chi scrive di più (cori + risposte)</div>'+rows.map(function(r){return bar(r[0],r[1],m)}).join(''):'<div class="vuoto">Ancora nessun coro scritto.</div>')+'<div class="vuoto" style="margin-top:8px;font-size:12px">Le visite alla Curva sono in "Dove si entra di più". Conta gli ultimi cori e le risposte degli ultimi 30 giorni.</div></div>';
  }
}
function totogirrr(){
  var box=document.getElementById('tt');if(!box)return;
  if(DEMO){draw({classifica:[{team:'Oranje VC',crediti:455,debito:0,ingioco:40},{team:'Grodah',crediti:380,debito:0,ingioco:0},{team:'WOA',crediti:610,debito:0,ingioco:25}]});return}
  fetch(SUP+'/rest/v1/rpc/toto_stato',{method:'POST',headers:{apikey:SKEY,Authorization:'Bearer '+SKEY,'Content-Type':'application/json'},body:JSON.stringify({p_team:FG.team,p_code:FG.code})}).then(function(r){return r.ok?r.json():null}).then(function(s){if(s&&s.classifica)draw(s)}).catch(function(){});
  function draw(s){
    var rows=s.classifica.map(function(c){return {t:c.team,v:Number(c.crediti)+Number(c.ingioco)-Number(c.debito||0),in:Number(c.ingioco)}}).sort(function(a,b){return b.v-a.v});
    var m=Math.max.apply(null,rows.map(function(r){return r.v}).concat([1])),st=s.stat||{},inGioco=rows.reduce(function(a,r){return a+r.in},0);
    box.innerHTML='<div class="card"><h3>Totogirrr</h3><div class="kpi" style="margin-bottom:12px"><div><small>Scommettitori</small><b>'+rows.length+' su 10</b></div><div><small>Crediti in gioco</small><b>'+f0(inGioco)+'</b></div></div>'
      +rows.map(function(r){return bar(r.t,r.v,m)}).join('')+'<div class="vuoto" style="margin-top:8px;font-size:12px">Totale = crediti liberi + quelli sulle schedine aperte − debiti.</div></div>';
  }
}
fetch('../data.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(D){
  var ok=DEMO||(FG.team==='Oranje VC'&&D.lock&&D.lock['Oranje VC']&&hshF('Oranje VC|'+(FG.code||''))===D.lock['Oranje VC']);
  var el=document.getElementById('st');
  if(!ok){el.innerHTML='<div class="card"><h3>Pagina riservata</h3><div class="vuoto">Questa pagina è solo per Oranje VC. Se sei tu, apri il sito dal tuo link personale e torna qui.</div></div>';return}
  el.innerHTML=(DEMO?'<div class="card prova"><b style="color:var(--hi)">PROVA</b> · Questi numeri sono finti, servono solo a vedere come sarà.</div>':'')+'<div class="vuoto">Carico i numeri…</div>';
  leggi().then(function(j){disegna(j);if(DEMO){var p=document.createElement('div');p.className='card prova';p.innerHTML='<b style="color:var(--hi)">PROVA</b> · Questi numeri sono finti, servono solo a vedere come sarà.';el.insertBefore(p,el.firstChild)}});
}).catch(function(){document.getElementById('st').innerHTML='<div class="err">Non riesco a leggere i dati.</div>'});
})();
</script>
<script src="../assets/app.js"></script>
</body>
</html>
