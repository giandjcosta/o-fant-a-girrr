/* tema */
function tema(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('tc').setAttribute('content',t==='dark'?'#0b0f14':'#ffffff');try{localStorage.setItem('cv-tema',t)}catch(e){}}
(function(){var t=null;try{t=localStorage.getItem('cv-tema')}catch(e){}if(!t)t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';tema(t)})();
function curTema(){return document.documentElement.getAttribute('data-theme')}
/* render */
function testo(s){return esc(s).replace(/#(\w+)/g,'<span class="hs">#$1</span>')}
function resCard(){
 if(!ST.ult)return '';
 return '<div class="res"><h4>Campionato · '+ST.ult.n+'ª giornata</h4>'+ST.ult.m.map(function(m){var gc=m[4].split('-');return '<div class="g"><span class="'+(+gc[0]<+gc[1]?'l':'')+'">'+esc(cap(m[0]))+'</span><em>'+gc[0]+' - '+gc[1]+'</em><span class="'+(+gc[1]<+gc[0]?'l':'')+'" style="text-align:left">'+esc(cap(m[3]))+'</span></div>'}).join('')+'</div>'+
 '<div class="res"><h4>Classifica</h4>'+ST.cls.slice(0,5).map(function(t,i){return '<div class="c"><i>'+(i+1)+'</i><span>'+esc(cap(t.n))+'</span><u>'+String(t.fp).replace('.',',')+' fp</u><b>'+t.pt+' pt</b></div>'}).join('')+'</div>'
}
function reply(r,sz){var ra=acc(r.a);return '<div class="rp"><div class="av sm" data-u="'+ra.h+'" style="background:'+bg(ra)+'">'+sg(ra)+'</div><div class="pb"><div class="pn" style="font-size:14px"><b data-u="'+ra.h+'">'+esc(cap(ra.n))+'</b>'+badge(ra.v)+'<span class="h">@'+ra.h+'</span><span class="tm">· '+ago(r.m)+'</span></div><div class="pt" style="font-size:14.5px;margin-bottom:0">'+testo(r.x)+'</div></div></div>'}
function postHTML(p){
 var a=acc(p.a),A=ap[p.id]?1:0,R=ril[p.id]?1:0,own=p.a===meH||me===ADMIN;
 var ex=(p.tipo==='ris'?resCard():'')+(p.tipo==='gio'?'<a class="lnk" href="giornale.html">Apri il Giornale ›</a>':'');
 var th=(p.thr||[]).map(function(x){return reply({a:p.a,x:x,m:p.m})}).join('');
 return '<article class="post" data-i="'+p.id+'"><div class="av" data-u="'+a.h+'" style="background:'+bg(a)+'">'+sg(a)+'</div><div class="pb">'+
  '<div class="pn"><b data-u="'+a.h+'">'+esc(cap(a.n))+'</b>'+badge(a.v)+'<span class="h">@'+a.h+'</span><span class="tm">· '+ago(p.m)+'</span></div>'+
  '<div class="pt">'+testo(p.x)+'</div>'+ex+
  (th?'<div class="thr'+(open['t'+p.id]?' open':'')+'">'+th+'</div><button class="lnk" data-a="thr" style="color:var(--blu)">'+(open['t'+p.id]?'Nascondi il thread':'Mostra il thread')+'</button>':'')+
  '<div class="acts"><button class="rsp'+(open[p.id]?' on':'')+'" data-a="rsp">'+I.rsp+(p.r.length||'')+'</button><button class="ril'+(R?' on':'')+'" data-a="ril">'+I.ril+(p.ril+R||'')+'</button><button class="app'+(A?' on':'')+'" data-a="app">'+I.app+(p.ap+A||'')+'</button><button style="cursor:default">'+I.vis+fmt(p.v)+'</button>'+(own?'<button class="del" data-a="del" title="Elimina">'+I.del+'</button>':'')+'</div>'+
  '<div class="thr'+(open[p.id]?' open':'')+'">'+p.r.map(function(r){return reply(r)}).join('')+'<div class="rf"><input maxlength="140" placeholder="Scrivi una risposta…"><button class="btn" data-a="invia" style="padding:8px 14px;font-size:13px">Rispondi</button></div></div></div></article>'
}
function feed(L){return L.length?L.map(postHTML).join(''):'<div class="vuoto">Ancora niente qui.</div>'}
function navR(){
 var it=[['home','Home',I.home],['esplora','Esplora',I.expl],['notif','Notifiche',I.bell],['profilo','Profilo',I.user]];
 document.getElementById('nav').innerHTML='<div class="logo" data-v="home"><div class="lg"></div></div>'+it.map(function(x){var on=vista===x[0]||(vista==='u'&&x[0]==='profilo'&&vprof===meH);return '<button data-v="'+x[0]+'" class="'+(on?'on':'')+'" aria-label="'+x[1]+'">'+x[2]+'<span class="t">'+x[1]+'</span>'+(x[0]==='notif'&&nuove?'<span class="bd">'+nuove+'</span>':'')+'</button>'}).join('')+'<button class="btn postbtn" data-v="scrivi">Lancia un coro</button>'
}
function topR(titolo,sott,tabs){
 var back=vista==='u'&&vprof!==meH;
 document.getElementById('top').innerHTML='<div class="bar">'+(back?'<button class="ib" data-v="home" aria-label="Indietro">'+I.back+'</button>':'<div class="av sm me" data-v="profilo" style="background:'+col(me)+'">'+sigla(me)+'</div>')+
  '<div class="tt">'+(vista==='home'?'<span style="display:flex;align-items:center;gap:8px"><i class="lg" style="width:28px;height:28px"></i>Curva</span>':esc(titolo)+(sott?'<small>'+esc(sott)+'</small>':''))+'</div>'+
  '<button class="ib" id="tg" aria-label="Cambia tema">'+(curTema()==='dark'?I.sun:I.moon)+'</button></div>'+(tabs?'<div class="tabs">'+tabs+'</div>':'');
 document.getElementById('tg').onclick=function(){tema(curTema()==='dark'?'light':'dark');render()};
}
var TR=[['#Giornata'+(ST.ult?ST.ult.n:1),'2,4 mila cori'],['#AstaDiRiparazione','860 cori'],['#LampadinaNuova','612 cori'],['#BufalaDiMercato','498 cori'],['#FC27','341 cori']];
function whoRow(h){var a=acc(h);return '<div class="who"><div class="av sm" data-u="'+h+'" style="background:'+bg(a)+'">'+sg(a)+'</div><div class="n"><b data-u="'+h+'">'+esc(a.n)+badge(a.v)+'</b><small>@'+h+'</small></div><button class="btn blu" data-seg="'+h+'">'+(seguiti[h]?'Seguito':'Segui')+'</button></div>'}
function dxR(){
 TR[0][0]='#Giornata'+(ST.ult?ST.ult.n:1);
 document.getElementById('dx').innerHTML='<div class="box"><h3>Tendenze</h3>'+TR.map(function(t){return '<div class="it"><small>Tendenza nella lega</small><b>'+t[0]+'</b><small>'+t[1]+'</small></div>'}).join('')+'<div class="it"><small>Cambiano dopo ogni giornata.</small></div></div>'+
 '<div class="box"><h3>Chi seguire</h3>'+['giornale_girrr','lega_ofantagirrr','ciro_trattativa'].map(whoRow).join('')+'</div>'
}
function render(){
 var v=document.getElementById('vista'),h='';
 TR[0][0]='#Giornata'+(ST.ult?ST.ult.n:1);
 if(vista==='profilo'){vista='u';vprof=meH}
 if(vista==='home'){
  topR('Curva','','<button data-f="tutti" class="'+(filt==='tutti'?'on':'')+'">Per te</button><button data-f="squadre" class="'+(filt==='squadre'?'on':'')+'">Squadre</button><button data-f="notizie" class="'+(filt==='notizie'?'on':'')+'">Notizie</button>');
  var pos=posiz(me),pr=prossimo(me);
  h+='<div class="mine"><div class="av" data-v="profilo" style="background:'+col(me)+'">'+sigla(me)+'</div><div><b>'+esc(cap(me))+'</b><span>'+(pr?'Prossima partita: contro '+esc(cap(pr)):'La tua squadra')+'</span></div>'+(pos?'<div class="pos">'+pos+'ª<small>'+ST.cls[pos-1].pt+' punti</small></div>':'')+'</div>';
  h+='<div class="comp"><div class="av" style="background:'+col(me)+'">'+sigla(me)+'</div><div class="cb"><textarea id="tx" rows="2" maxlength="160" placeholder="Cosa succede in curva?"></textarea><div class="cr"><span class="cnt" id="cnt">'+MAX+'</span><button class="btn" id="go" disabled>Lancia il coro</button></div></div></div>';
  h+=feed(P.filter(function(p){var k=acc(p.a).k;return filt==='tutti'||(filt==='squadre'&&k==='sq')||(filt==='notizie'&&(k==='org'||k==='pro'))}));
 }else if(vista==='esplora'){
  topR('Esplora','Tendenze e account da seguire');
  h+='<div class="sec">Tendenze</div>'+TR.map(function(t){return '<div class="nt"><div><small style="margin:0">Tendenza nella lega</small><p style="font-weight:800">'+t[0]+'</p><small>'+t[1]+'</small></div></div>'}).join('')+'<div class="nt"><small style="margin:0">Le tendenze cambiano dopo ogni giornata.</small></div><div class="sec">Chi seguire</div>'+
  ['lega_ofantagirrr','giornale_girrr','ciro_trattativa','nonno_cesare','tifoso_arrabbiato','mister_divano','radio_spogliatoio','mamma_di_capitan','ex_ds_provincia','var_parlante','fc27_ratings'].map(function(k){var a=acc(k);return '<div class="nt"><div class="av" data-u="'+k+'" style="background:'+bg(a)+'">'+sg(a)+'</div><div style="flex:1;min-width:0"><p><b data-u="'+k+'" style="cursor:pointer">'+esc(a.n)+'</b> '+badge(a.v)+'</p><small style="margin:0">@'+k+'</small><p style="font-size:14px;color:var(--mu);margin-top:3px">'+esc(a.bio)+'</p></div><button class="btn blu" data-seg="'+k+'" style="align-self:flex-start;padding:7px 14px;font-size:13px">'+(seguiti[k]?'Seguito':'Segui')+'</button></div>'}).join('');
 }else if(vista==='notif'){
  topR('Notifiche','');nuove=0;
  h+=notif.map(function(n){var a=acc(n.t);return '<div class="nt"><div class="av sm" data-u="'+a.h+'" style="background:'+bg(a)+'">'+sg(a)+'</div><div><p><b data-u="'+a.h+'" style="cursor:pointer">'+esc(cap(a.n))+'</b> '+n.x+'</p><small>'+ago(n.m)+'</small></div></div>'}).join('');
 }else{
  var a=acc(vprof),isSq=a.k==='sq',pos=isSq?posiz(a.n):0,mio=vprof===meH;
  topR(a.n,P.filter(function(p){return p.a===vprof}).length+' cori');
  var bio=isSq?(pos?cap(a.n)+' · '+pos+'ª in classifica con '+ST.cls[pos-1].pt+' punti. Campionato O Fant A Girrr.':'Squadra della lega O Fant A Girrr.'):a.bio;
  var c1=a.c?a.c[0]:'hsl('+hue(a.n)+' 60% 40%)',c2=a.c?a.c[1]:'hsl('+((hue(a.n)+40)%360)+' 55% 22%)';
  h+='<div class="ban" style="--c1:'+c1+';--c2:'+c2+'"></div><div class="pf"><div class="r1"><div class="av xl" style="background:'+bg(a)+'">'+sg(a)+'</div>'+(mio?'<button class="btn out" disabled>Il tuo profilo</button>':'<button class="btn blu" data-seg="'+vprof+'">'+(seguiti[vprof]?'Seguito':'Segui')+'</button>')+'</div>'+
   '<h2>'+esc(cap(a.n))+badge(a.v)+'</h2><div class="h">@'+a.h+'</div><p>'+esc(bio)+'</p>'+(a.v?'<div class="etich">'+badge(a.v)+(a.v==='oro'?' Account ufficiale':' Account verificato')+'</div>':'')+
   '<div class="st"><span><b>'+(isSq?9:12+hue(a.n)%40)+'</b> Seguiti</span><span><b>'+(isSq?10+hue(a.n)%7:100+hue(a.n)*3)+'</b> Follower</span></div></div>'+feed(P.filter(function(p){return p.a===vprof}));
 }
 v.innerHTML=h;navR();dxR();
 var tx=document.getElementById('tx');if(tx){tx.addEventListener('input',conta);conta()}
 var go=document.getElementById('go');if(go)go.onclick=lancia;
}
function conta(){var tx=document.getElementById('tx'),c=document.getElementById('cnt'),go=document.getElementById('go');if(!tx)return;var r=MAX-tx.value.length;c.textContent=r;c.className='cnt'+(r<0?' over':r<20?' near':'');go.disabled=!tx.value.trim()||r<0;tx.style.height='auto';tx.style.height=tx.scrollHeight+'px'}
var BOT=[['tifoso_arrabbiato','Cambiate allenatore.'],['nonno_cesare','Ai miei tempi non si scriveva, si urlava.'],['mister_divano','Sorpreso? Io no. Il 4-3-3 non mente.'],['radio_spogliatoio','Voci di corridoio: è vero. O forse no.'],['var_parlante','Rivisto. Dubbi.']];
function lancia(){
 var tx=document.getElementById('tx'),v=maiusc(tx.value.trim());if(!v||v.length>MAX)return;
 var id=nid++;P.unshift({id:id,a:meH,x:v,m:0,ap:0,ril:0,v:3,r:[]});filt='tutti';render();
 setTimeout(function(){var p=P.filter(function(x){return x.id===id})[0];if(!p)return;var b=BOT[Math.floor(Math.random()*BOT.length)];p.ap+=3;p.v+=41;p.r.push({a:b[0],x:b[1],m:0});notif.unshift({t:b[0],x:'ha risposto al tuo coro.',m:0});nuove++;if(vista==='home')render();else navR()},2600);
}
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-v],[data-u],[data-f],[data-seg],[data-a]');if(!el)return;
 var d=el.dataset;
 if(d.v){if(d.v==='scrivi'){vista='home';filt='tutti';render();var t=document.getElementById('tx');if(t)t.focus();return}vista=d.v;scrollTo(0,0);render();return}
 if(d.u){vprof=d.u;vista='u';scrollTo(0,0);render();return}
 if(d.f){filt=d.f;render();return}
 if(d.seg){seguiti[d.seg]=!seguiti[d.seg];render();return}
 var a=d.a,po=el.closest('.post');if(!po)return;
 var id=+po.dataset.i,p=P.filter(function(x){return x.id===id})[0];
 if(a==='app')ap[id]=!ap[id];else if(a==='ril')ril[id]=!ril[id];else if(a==='rsp')open[id]=!open[id];else if(a==='thr')open['t'+id]=!open['t'+id];
 else if(a==='del')P=P.filter(function(x){return x.id!==id});
 else if(a==='invia'){var i=po.querySelector('.rf input'),t=maiusc(i.value.trim());if(!t)return;p.r.push({a:meH,x:t,m:0});open[id]=true}
 else return;
 render();
});
var TF=['tutti','squadre','notizie'],tx0=null,ty0=0;
document.addEventListener('touchstart',function(e){if(vista!=='home'||!e.target.closest('#vista')){tx0=null;return}var t=e.touches[0];tx0=t.clientX;ty0=t.clientY},{passive:true});
document.addEventListener('touchend',function(e){if(tx0===null)return;var t=e.changedTouches[0],dx=t.clientX-tx0,dy=t.clientY-ty0;tx0=null;
 if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5)return;
 var i=TF.indexOf(filt),n=i+(dx<0?1:-1);if(n<0||n>=TF.length)return;
 filt=TF[n];render();var v=document.getElementById('vista');v.classList.add(dx<0?'sl-l':'sl-r');setTimeout(function(){v.classList.remove('sl-l','sl-r')},320)},{passive:true});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.matches&&e.target.matches('.rf input')){e.target.closest('.post').querySelector('[data-a=invia]').click()}});
fetch('../data.json',{cache:'no-store'}).then(function(r){return r.json()}).then(calcola).catch(function(){}).then(function(){seed();render()});
})();
