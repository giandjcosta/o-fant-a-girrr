<!doctype html>
<html lang="it">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tabellone · O Girrr</title>
<link rel="icon" type="image/png" href="../assets/favicon-64.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap">
<style>
@property --acc{syntax:'<color>';inherits:true;initial-value:#d62839}
@property --bg{syntax:'<color>';inherits:true;initial-value:#1d2a52}
@property --bg2{syntax:'<color>';inherits:true;initial-value:#2c3f7c}
@property --bg3{syntax:'<color>';inherits:true;initial-value:#141d3d}
@property --chiaro{syntax:'<color>';inherits:true;initial-value:#fbf6ec}
@property --hi{syntax:'<color>';inherits:true;initial-value:#ffd166}
@property --sub{syntax:'<color>';inherits:true;initial-value:#bfe3ff}
*{box-sizing:border-box;margin:0;padding:0}
body{--acc:#d62839;--bg:#1d2a52;--bg2:#2c3f7c;--bg3:#141d3d;--chiaro:#fbf6ec;--hi:#ffd166;--sub:#bfe3ff;
 transition:--acc .8s ease,--bg .8s ease,--bg2 .8s ease,--bg3 .8s ease,--chiaro .8s ease,--hi .8s ease,--sub .8s ease;
 min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--chiaro);background:var(--bg);
 background-image:radial-gradient(1200px 700px at 80% -10%,var(--bg2) 0,var(--bg) 55%,var(--bg3) 100%);background-attachment:fixed}
body[data-mode=coppa]{--acc:#3d93d6;--bg:#12305c;--bg2:#1f4a85;--bg3:#0b2142;--chiaro:#f7fbff;--hi:#bfe3ff;--sub:#bfe3ff}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 28px}
.back{display:inline-block;margin-bottom:10px;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--hi);text-decoration:none}
.top{display:flex;align-items:center;gap:18px;justify-content:space-between}
.crossfade{position:relative;flex:none}
.crossfade img{display:block;transition:opacity .7s ease,transform .7s ease}
.crossfade img+img{position:absolute;inset:0;opacity:0;transform:scale(.94)}
body[data-mode=coppa] .crossfade img:first-child{opacity:0;transform:scale(.94)}
body[data-mode=coppa] .crossfade img+img{opacity:1;transform:none}
.shield{height:clamp(86px,16vw,150px)}
.tv{height:clamp(40px,7vw,70px)}
.ttl{flex:1;min-width:0}
.kick{font-weight:900;font-size:clamp(11px,1.6vw,15px);letter-spacing:.4em;color:var(--hi)}
h1{font-weight:900;font-size:clamp(24px,4.6vw,46px);line-height:1.05;margin-top:4px}
.sw{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:18px 0 12px;background:rgba(255,255,255,.1);border-radius:999px;padding:4px;max-width:440px}
.sw i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--acc);transition:transform .55s cubic-bezier(.6,0,.2,1),background-color .8s}
body[data-mode=coppa] .sw i{transform:translateX(100%)}
.sw button{position:relative;z-index:1;background:none;border:0;color:var(--chiaro);font:800 14px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:11px 8px;cursor:pointer}
.gs{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.gs .ar{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:var(--chiaro);font:900 18px Inter;cursor:pointer}
.gs .ar:disabled{opacity:.3;cursor:default}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;scroll-behavior:smooth;flex:1}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-width:40px;height:38px;border-radius:19px;border:2px solid transparent;background:rgba(255,255,255,.08);color:var(--chiaro);font:800 15px Inter;cursor:pointer;opacity:.55;transition:all .25s}
.chips button.pl{opacity:1;background:rgba(255,255,255,.18)}
.chips button.nx{opacity:1;border-color:var(--hi)}
.chips button.sel{background:var(--acc);border-color:var(--acc);opacity:1;transform:scale(1.08)}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}.tv{display:none}}
.swap{transition:opacity .22s ease,transform .22s ease}
.swap.out{opacity:0;transform:translateY(8px)}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(8px,2vw,22px);align-items:center;padding:clamp(10px,2vw,16px) clamp(10px,2vw,16px) clamp(10px,2vw,16px) clamp(12px,2vw,18px);margin-bottom:12px;background:rgba(255,255,255,.08);border-left:8px solid var(--acc);border-radius:4px 14px 14px 4px;animation:in .5s both;transition:border-color .8s}
@keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.m.cp{grid-template-columns:auto 1fr auto 1fr}
.g{width:clamp(30px,5vw,44px);height:clamp(30px,5vw,44px);border-radius:50%;background:var(--hi);color:var(--bg);display:grid;place-items:center;font-weight:900;font-size:clamp(16px,2.6vw,24px)}
.t{display:flex;flex-direction:column;gap:2px;font-weight:800;text-transform:uppercase;font-size:clamp(13px,2.1vw,22px);letter-spacing:.02em;opacity:.6;min-width:0;overflow-wrap:anywhere}
.t.w{opacity:1}
.t.h{align-items:flex-end;text-align:right}
.t small{font-size:.74em;font-weight:600;color:var(--sub);letter-spacing:.05em}
.sc{display:flex;align-items:center;gap:6px}
.sc b{display:grid;place-items:center;width:clamp(36px,7vw,60px);height:clamp(46px,9vw,76px);background:var(--chiaro);color:var(--bg);border-radius:8px;font-weight:900;font-size:clamp(28px,5.6vw,58px);transition:background-color .8s,color .8s}
.sc i{width:9px;height:5px;background:var(--hi);display:block}
.rip{font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);margin:4px 2px 0}
.nota{font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);margin:0 2px 12px}
.panel h3{font-weight:900;font-size:15px;letter-spacing:.34em;color:var(--hi);margin:0 0 8px}
.panel h3:not(:first-child){margin-top:22px}
table{width:100%;border-collapse:collapse;font-size:clamp(14px,2vw,19px);font-weight:700}
th{font-size:11px;letter-spacing:.16em;color:var(--sub);text-align:right;padding:0 6px 6px;font-weight:800}
th:nth-child(2){text-align:left}
td{padding:9px 6px;text-align:right;border-bottom:1px solid rgba(255,255,255,.15)}
td.p{width:34px;text-align:center;font-weight:900;color:var(--hi)}
td.n{text-align:left;text-transform:uppercase;font-weight:800;font-size:.92em}
td.pt{font-weight:900;font-size:1.15em}
td.fp{font-size:.82em;color:var(--sub);font-weight:600}
tr.me td{background:rgba(255,209,102,.2)}
tr.me td.n,tr.me td.pt{color:var(--hi)}
.t.mine>span{color:var(--hi);background:rgba(255,209,102,.18);border-radius:6px;padding:1px 7px;margin-inline:-7px}
.rip b{color:var(--hi)}
tr.pod td.p{background:var(--acc);color:var(--chiaro);transition:background-color .8s}
tr{animation:in .45s both}
.sp{margin-top:26px;background:var(--chiaro);border-radius:14px;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px 22px;transition:background-color .8s}
.sp span{font-weight:800;font-size:13px;letter-spacing:.06em;color:var(--bg)}
.sp img{height:clamp(44px,7vw,66px)}
.err{padding:30px;text-align:center;font-weight:700}
.foot{margin-top:14px;text-align:center;font-size:12px;color:var(--sub);opacity:.8}
body::before{content:'';position:fixed;inset:-120px;z-index:-1;pointer-events:none;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 36px,transparent 36px 72px);animation:strisce 9s linear infinite}
@keyframes strisce{to{transform:translate3d(79.45px,0,0)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
</style>
</head>
<body data-mode="lega"><div style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#ffd23f;color:#111;font:800 11px/1 Inter,sans-serif;letter-spacing:.12em;text-align:center;padding:5px 8px;text-transform:uppercase">Sito di prova · dati finti · non è il sito vero</div>
<div class="wrap">
  <a class="back" href="index.html">‹ O Girrr</a>
  <header class="top">
    <div class="crossfade"><img class="shield" src="../assets/loghi/logo-lega-o-fant-a-girrr.png" alt="O Fant A Girrr"><img class="shield" src="../assets/loghi/logo-cup-champions-cup.png" alt="Champions Cup"></div>
    <div class="ttl"><div class="kick" id="kick">TABELLONE</div><h1 id="tit">…</h1></div>
    <div class="crossfade"><img class="tv" src="../assets/loghi/logo-tv-girrr-sport-live.png" alt=""><img class="tv" src="../assets/loghi/logo-tv-cup-girrr-live.png" alt=""></div>
  </header>
  <div class="sw" role="tablist"><i></i><button data-m="lega" role="tab">Campionato</button><button data-m="coppa" role="tab">Champions Cup</button></div>
  <div class="gs"><button class="ar" id="prev" aria-label="Giornata precedente">‹</button><div class="chips" id="chips"></div><button class="ar" id="next" aria-label="Giornata successiva">›</button></div>
  <div class="grid">
    <section><div class="swap" id="board"></div></section>
    <aside class="panel"><div class="swap" id="tab"></div></aside>
  </div>
  <div class="sp"><span>Gentilmente offerto da</span><img src="../assets/loghi/sponsor-birra-contropiede.png" alt=""><img src="../assets/loghi/sponsor-pizzeria-fuorigioco.png" alt=""><img src="../assets/loghi/sponsor-bomber-gym-club.png" alt=""><img src="../assets/loghi/sponsor-amaro-del-mister.png" alt=""></div>
  <div class="foot" id="foot">O Girrr · i dati arrivano dallo Spogliatoio</div>
</div>
<script>
(function(){
var ORD=["The Blue brothers","Apo team","Mariana Coneja","stif dc","Real Madrink","Atletico ma non troppo","Oranje VC","AFA SELECCION","Grodah","WOA"];
var D=null, mode='lega', sel={lega:1,coppa:1};
function cap(s){s=String(s);return s.charAt(0).toUpperCase()+s.slice(1)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pt(x){return String(Math.round(x*100)/100).replace('.',',')}
function played(g,cup){var i=cup?5:4;return g.m.some(function(m){return m[i]!=='-'})}
function cal(){return mode==='coppa'?D.cal.cup:D.cal.lega}
function classifica(rounds,cup){
  var sq={};function r(n){return sq[n]||(sq[n]={n:n,g:0,pt:0,fp:0,gf:0,gs:0,gir:''})}
  rounds.forEach(function(g){
    g.m.forEach(function(m){
      var gir='',casa,pc,pf,fuori,ris;
      if(cup){gir=m[0];casa=m[1];pc=m[2];pf=m[3];fuori=m[4];ris=m[5]}else{casa=m[0];pc=m[1];pf=m[2];fuori=m[3];ris=m[4]}
      var a=r(casa),b=r(fuori);a.gir=b.gir=gir;
      if(ris==='-')return;
      var s=ris.split('-').map(Number);
      [[a,s[0],s[1],pc],[b,s[1],s[0],pf]].forEach(function(x){x[0].g++;x[0].gf+=x[1];x[0].gs+=x[2];x[0].fp+=x[3];x[0].pt+=x[1]>x[2]?3:(x[1]===x[2]?1:0)});
    });
    (g.rest||[]).forEach(function(x){r(x[1]).gir=x[0]});
  });
  return Object.keys(sq).map(function(k){return sq[k]}).sort(function(x,y){
    return y.pt-x.pt||y.fp-x.fp||(y.gf-y.gs)-(x.gf-x.gs)||y.gf-x.gf||((ORD.indexOf(x.n)<0?99:ORD.indexOf(x.n))-(ORD.indexOf(y.n)<0?99:ORD.indexOf(y.n)))||(x.n<y.n?-1:1)});
}
function tabella(rows,fp,titolo,top){
  var h='<h3>'+titolo+'</h3><table>'+(fp?'<tr><th></th><th>Squadra</th><th>G</th><th>Pt</th><th>Fantapunti</th></tr>':'<tr><th></th><th>Squadra</th><th>G</th><th>Pt</th></tr>');
  rows.forEach(function(x,k){h+='<tr class="'+(k<top?'pod':'')+(x.n===ME?' me':'')+'" style="animation-delay:'+(k*35)+'ms"><td class="p">'+(k+1)+'</td><td class="n">'+esc(cap(x.n))+'</td><td>'+x.g+'</td><td class="pt">'+x.pt+'</td>'+(fp?'<td class="fp">'+pt(x.fp)+'</td>':'')+'</tr>'});
  return h+'</table>';
}
var ME='';try{ME=(JSON.parse(localStorage.getItem('fg')||'{}')||{}).team||''}catch(e){}
function lastPlayed(c,cup){var l=0;c.forEach(function(g){if(played(g,cup))l=g.n});return l}
function render(){
  var cup=mode==='coppa',c=cal(),n=sel[mode],g=c.filter(function(x){return x.n===n})[0];
  if(!g)return;
  var pl=played(g,cup),lp=lastPlayed(c,cup);
  var tit=(cup?'Champions Cup':'Campionato')+' · '+n+'ª giornata';
  document.getElementById('tit').textContent=tit;
  document.getElementById('kick').textContent=pl?'RISULTATI':(n===lp+1?'PROSSIMA GIORNATA':'DA GIOCARE');
  document.title='Tabellone · '+tit;
  var b='<div class="nota">Serie A · giornata '+g.sa+'</div>';
  g.m.forEach(function(m,k){
    var gir='',casa,pc,pf,fuori,ris;
    if(cup){gir=m[0];casa=m[1];pc=m[2];pf=m[3];fuori=m[4];ris=m[5]}else{casa=m[0];pc=m[1];pf=m[2];fuori=m[3];ris=m[4]}
    var wc='w',wf='w',sc='<b>–</b><i></i><b>–</b>',fc='',ff='';
    if(ris!=='-'){var s=ris.split('-').map(Number);wc=s[0]>=s[1]?'w':'';wf=s[1]>=s[0]?'w':'';
      if(s[0]>s[1])wf='';if(s[1]>s[0])wc='';
      sc='<b>'+s[0]+'</b><i></i><b>'+s[1]+'</b>';fc='<small>'+pt(pc)+'</small>';ff='<small>'+pt(pf)+'</small>'}
    b+='<div class="m'+(cup?' cp':'')+'" style="animation-delay:'+(k*70)+'ms">'+(cup?'<div class="g">'+esc(gir)+'</div>':'')+'<div class="t h '+wc+(casa===ME?' mine':'')+'"><span>'+esc(cap(casa))+'</span>'+fc+'</div><div class="sc">'+sc+'</div><div class="t '+wf+(fuori===ME?' mine':'')+'"><span>'+esc(cap(fuori))+'</span>'+ff+'</div></div>';
  });
  if(cup&&g.rest&&g.rest.length)b+='<div class="rip">Riposano: '+g.rest.map(function(x){return (x[1]===ME?'<b>'+esc(cap(x[1]))+'</b>':esc(cap(x[1])))+' (gir. '+esc(x[0])+')'}).join(' · ')+'</div>';
  var upto=c.filter(function(x){return x.n<=n&&played(x,cup)});
  var cl=classifica(upto.length?upto:[c[0]],cup),t;
  if(cup){t=tabella(cl.filter(function(x){return x.gir==='A'}),false,'Girone A',2)+tabella(cl.filter(function(x){return x.gir==='B'}),false,'Girone B',2)}
  else t=tabella(cl,true,'Classifica dopo la '+(upto.length?upto[upto.length-1].n:0)+'ª',3);
  var bd=document.getElementById('board'),tb=document.getElementById('tab');
  bd.classList.add('out');tb.classList.add('out');
  setTimeout(function(){bd.innerHTML=b;tb.innerHTML=t;bd.classList.remove('out');tb.classList.remove('out')},200);
  chips(c,cup,n,lp);
  document.getElementById('prev').disabled=n<=1;document.getElementById('next').disabled=n>=c.length;
}
function chips(c,cup,n,lp){
  var h='';c.forEach(function(g){h+='<button data-n="'+g.n+'" class="'+(g.n===n?'sel ':'')+(played(g,cup)?'pl':(g.n===lp+1?'nx':''))+'">'+g.n+'</button>'});
  var el=document.getElementById('chips');el.innerHTML=h;
  var s=el.querySelector('.sel');if(s)el.scrollLeft=s.offsetLeft-el.clientWidth/2+s.clientWidth/2;
}
function setMode(m){
  if(m===mode)return;mode=m;document.body.setAttribute('data-mode',m);
  try{history.replaceState(null,'','#'+m)}catch(e){}
  render();
}
function go(d){var c=cal(),n=sel[mode]+d;if(n<1||n>c.length)return;sel[mode]=n;render()}
document.querySelectorAll('.sw button').forEach(function(b){b.addEventListener('click',function(){setMode(b.getAttribute('data-m'))})});
document.getElementById('prev').onclick=function(){go(-1)};document.getElementById('next').onclick=function(){go(1)};
(function(){var cf=document.querySelector('.crossfade');if(cf){cf.style.cursor='pointer';cf.title='Torna a O Girrr';cf.addEventListener('click',function(){location.href='index.html'})}})();
document.getElementById('chips').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;sel[mode]=+b.getAttribute('data-n');render()});
document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});
function hshF(s){var h=2166136261,i;for(i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function loginDaLink(d){var k=(location.hash||'').replace('#','').trim().toUpperCase();if(!k||/^(LEGA|COPPA)/.test(k)||!d||!d.lock)return false;var ok=false;
  d.teams.forEach(function(x){if(hshF(x.name+'|'+k)===d.lock[x.name]){var o={};try{o=JSON.parse(localStorage.getItem('fg')||'{}')||{}}catch(e){}o.team=x.name;o.code=k;try{localStorage.setItem('fg',JSON.stringify(o))}catch(e){}ok=x.name}});
  if(ok){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}return ok}
fetch('../data.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
  D=d;if(loginDaLink(d)){try{ME=(JSON.parse(localStorage.getItem('fg')||'{}')||{}).team||''}catch(e){}}sel.lega=lastPlayed(d.cal.lega,false)||1;
  var lc=lastPlayed(d.cal.cup,true);sel.coppa=lc||1;
  var hm=/^#(lega|coppa)(?:-(\d+))?$/.exec(location.hash||'');
  if(hm){if(hm[1]==='coppa'){mode='coppa';document.body.setAttribute('data-mode','coppa')}if(hm[2]){var nn=+hm[2],mx=(hm[1]==='coppa'?d.cal.cup:d.cal.lega).length;sel[hm[1]]=Math.min(Math.max(1,nn),mx)}}
  render();
  document.getElementById('foot').textContent='Dati aggiornati al '+(d.cal.date||'');
}).catch(function(){document.getElementById('board').innerHTML='<div class="err">Non riesco a leggere i dati.</div>'});
})();
</script>
</body>
</html>
