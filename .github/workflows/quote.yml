name: Quote Totogirrr

on:
  schedule:
    - cron: "20 6 * * *"      # ogni giorno, circa le 8:20 italiane
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths: [data.json, scripts/toto_quote.py]

permissions:
  contents: write

jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ricalcola le quote
        run: python3 -I scripts/toto_quote.py json > /dev/null
      - name: Salva se sono cambiate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toto-quote.json
          git diff --cached --quiet || git commit -m "Aggiorna le quote di Totogirrr"
          git pull --rebase origin gh-pages
          git push
