name: Aggiorna statistiche e voti
# Gira ogni mattina (e a mano dal pulsante Run workflow). Legge le pagine pubbliche di Fantacalcio.it
# e aggiorna data.json del ramo gh-pages solo se c'e' qualcosa di nuovo.
on:
  schedule:
    - cron: "30 4 * * *"
    - cron: "20 7-22/3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/aggiorna-dati.yml']
permissions:
  contents: write
concurrency:
  group: aggiorna-dati
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leggo statistiche e voti
        run: python3 scripts/aggiorna_dati.py
      - name: Calendario di Serie A
        continue-on-error: true
        run: python3 scripts/aggiorna_calendario.py
      - name: Infortunati, quotazioni e probabili formazioni
        continue-on-error: true
        run: python3 scripts/aggiorna_prossima.py
      - name: Rifaccio il riepilogo
        run: python3 scripts/riepilogo.py
      - name: Totogirrr (quote, risultati, pagamenti e ping al database)
        continue-on-error: true
        env:
          TOTO_ADMIN: ${{ secrets.TOTO_ADMIN }}
        run: python3 scripts/toto_quote.py sync
      - name: Salvo se è cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json toto-quote.json RIEPILOGO.md riepilogo.html riepiloghi
          git reset -q scripts/__pycache__ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Aggiorna statistiche e voti in automatico"
          git pull --rebase origin gh-pages
          git push origin gh-pages
# formazioni: da 3 giorni prima
# data
