name: Riepilogo della giornata

on:
  push:
    branches: [gh-pages]
    paths: [data.json, scripts/riepilogo.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  riepilogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crea il riepilogo
        run: python3 scripts/riepilogo.py
      - name: Salva se e' cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RIEPILOGO.md riepiloghi
          git diff --cached --quiet || git commit -m "Aggiorna il riepilogo della giornata"
          git push
