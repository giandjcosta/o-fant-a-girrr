name: MVP dei tifosi - Votazioni e verdetti
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mvp-tifosi
  cancel-in-progress: false
jobs:
  aggiorna:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: code
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aggiorna soltanto dopo il rilascio della 6.0
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 code/calcoli/tifosi/sincronizza.py site --vai

      - name: Catalogo e dossier 6.2 nel giro ordinario, senza audio
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 code/calcoli/catalogo62.py site --vai
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f girrr/dati/mvp-editoriale.json ]; then
            git add girrr/dati/mvp-editoriale.json
            if ! git diff --cached --quiet; then
              git commit -m "Aggiorna il dossier MVP per i canali ordinari"
              git pull --rebase origin gh-pages
              git push origin gh-pages
            fi
          fi
