name: Prova fonti
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prova
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          for u in \
            "https://www.gazzetta.it/calcio/fantacalcio/probabili-formazioni-serie-a/" \
            "https://www.gazzetta.it/calcio/fantacalcio/" \
            "https://www.legaseriea.it/serie-a/calendario-risultati" \
            "https://www.legaseriea.it/api/auth/session" \
            "https://www.sky.it/sport/serie-a/probabili-formazioni" \
            "https://www.corrieredellosport.it/calcio/serie-a/probabili-formazioni" \
            "https://www.fantacalcio.it/probabili-formazioni-serie-a" ; do
            code=$(curl -s -o /tmp/o.html -w "%{http_code} %{size_download}" -A "$UA" -L --max-time 40 "$u")
            echo "$code  $u  title=$(grep -o '<title>[^<]*' /tmp/o.html | head -1)" >> /tmp/res.txt
          done
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p prova-fonti && cp /tmp/res.txt prova-fonti/risultato.txt && git add prova-fonti && git commit -qm "risultato prova" && git push
# v2
