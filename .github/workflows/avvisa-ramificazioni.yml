name: Claude - Avvisa le Ramificazioni del Registro
# ChatGPT, 16 novembre 2026: sostituisce gli avvisi ad ogni PR/commit con versione-only.
# Invio manuale opzionale; il Registro verifica la nuova versione pubblicata una volta al giorno.
# Non tocca il sito, non legge il codice delle PR. # Serve il segreto REGISTRO_AVVISO: un token di GitHub con accesso
# soltanto a o-girrr-registro. Senza il segreto rimane disponibile l'aggiornamento nel Registro.
on:
  # Nessun avviso a ogni commit, ramo o PR: la mappa si aggiorna alla nuova
  # versione del sito tramite il controllo giornaliero del Registro.
  # Questo comando rimane manuale, per un eventuale aggiornamento immediato.
  workflow_dispatch:
permissions: {}
concurrency:
  group: avvisa-ramificazioni
  cancel-in-progress: true
jobs:
  avvisa:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Avvisa il Registro
        env:
          TOKEN: ${{ secrets.REGISTRO_AVVISO }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::notice::Manca il segreto REGISTRO_AVVISO: il Registro controlla la versione pubblicata giornalmente."; exit 0; fi
          curl -sS -f -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/giandjcosta/o-girrr-registro/dispatches \
            -d '{"event_type":"ramificazioni-versione","client_payload":{"da":"o-fant-a-girrr"}}'
          echo "Registro avvisato."
