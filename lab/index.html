<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="../assets/favicon-64.png"><title>Laboratorio O Girrr</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lobster&family=Inter:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: colonna da telefono, barra di sezioni fissa in alto, un pannello per idea con indicazione di dove vivrebbe nell'app vera */
:root{
  --bg:#141d3d; --bg2:#1d2a52; --bg3:#2c3f7c;
  --ink:#fbf6ec; --mute:#bfe3ff; --gold:#ffd166; --red:#d62839; --blue:#3d93d6;
  --ok:#7be495; --bad:#ff6b7a; --line:rgba(255,255,255,.22); --glass:rgba(255,255,255,.11); --glass2:rgba(255,255,255,.05);
  --fd:Lobster,'Lobster Two',cursive; --fb:Inter,system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--fb);font-size:14px;line-height:1.45;min-height:100vh;
  background:radial-gradient(900px 520px at 85% -8%,rgba(214,40,57,.30),transparent 62%),radial-gradient(1000px 640px at -10% 18%,rgba(61,147,214,.28),transparent 60%),linear-gradient(180deg,#2c3f7c,#1d2a52 45%,#141d3d);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 60px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#1d2a52}
.col{max-width:620px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.top img{height:54px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.top h1{font-family:var(--fd);font-weight:400;font-size:30px;line-height:1;text-wrap:balance}
.top p{color:var(--mute);font-size:12px;font-weight:600;margin-top:3px}
.proto{display:inline-block;margin-top:6px;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#141d3d;background:var(--gold);padding:2px 8px;border-radius:99px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin:0 -2px 12px;scrollbar-width:none;background:linear-gradient(180deg,var(--bg3),transparent)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:8px 13px;border-radius:99px;font-weight:700;font-size:13px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px)}
.tabs button[aria-selected=true]{background:var(--red);border-color:#ff7a88;color:#fff}
.where{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;font-weight:700;color:var(--mute)}
.where b{color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:10px}
.where span.sep{opacity:.5}
.lead{color:var(--mute);font-size:13px;margin-bottom:12px;max-width:62ch}
h2{font-family:var(--fd);font-weight:400;font-size:26px;margin-bottom:4px}
h3{font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;backdrop-filter:blur(16px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 24px rgba(7,12,35,.35)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--glass2);border:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;padding:7px 10px;border-radius:10px;font-weight:700;font-size:12.5px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--gold);color:#141d3d}
.mut{color:var(--mute)}.sm{font-size:12px}.num{font-variant-numeric:tabular-nums}
.btn{padding:10px 16px;border-radius:12px;background:var(--red);color:#fff;font-weight:800;border:1px solid #ff7a88}
.btn.ghost{background:var(--glass);border-color:var(--line)}
select,input[type=range]{width:100%}
select{padding:10px 12px;border-radius:12px;background:#1d2a52;color:var(--ink);border:1px solid var(--line);font:inherit;font-weight:600}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;color:#fff;border:2px solid rgba(255,255,255,.4)}
.me{outline:2px solid var(--gold);outline-offset:-2px}
/* Probabilità */
.pr{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.pr:first-of-type{border-top:0}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .5s}
.bar.u i{background:linear-gradient(90deg,#ff9aa5,var(--bad))}
.pct{font-weight:900;font-size:17px;text-align:right;min-width:62px}
.dl{display:block;font-size:11px;font-weight:700}
.up{color:var(--ok)}.dn{color:var(--bad)}
/* Sfide */
.ch{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.ch .vs{font-family:var(--fd);font-size:22px;color:var(--gold)}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--glass2);border:1px solid var(--line)}
.tag.g{background:var(--gold);color:#141d3d;border-color:var(--gold)}.tag.o{background:rgba(123,228,149,.2);color:var(--ok);border-color:var(--ok)}.tag.r{background:rgba(255,107,122,.2);color:var(--bad);border-color:var(--bad)}
/* Albo */
.aw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.aw>div{border:1px solid var(--line);border-radius:16px;padding:11px;background:var(--glass2)}
.aw .k{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.aw b{display:block;font-size:15px;margin-top:3px;line-height:1.2}
.aw.v .k{color:var(--bad)}
.aw .k.g{color:var(--gold)}
@media(max-width:380px){.aw{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:left;padding:4px 6px}
.tbl td{padding:7px 6px;border-top:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right}
.scroll{overflow-x:auto}
/* Derby */
.mt{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mt:first-of-type{border-top:0}
.mt .t{font-weight:700}.mt .t:last-child{text-align:right}
.derby{border-radius:16px;border:1px solid #ff7a88;background:linear-gradient(135deg,rgba(214,40,57,.34),rgba(255,209,102,.1));padding:12px;margin:6px 0}
.derby .hd{font-family:var(--fd);font-size:21px;color:var(--gold)}
.h2h{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;text-align:center;align-items:end;margin:8px 0}
.h2h b{font-size:28px;font-weight:900;line-height:1}
.h2h small{display:block;font-size:11px;color:var(--mute);font-weight:700}
/* Borsino */
.bs{display:grid;grid-template-columns:1fr 84px auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 4px;border-top:1px solid var(--line)}
.bs:first-of-type{border-top:0}
.bs[aria-pressed=true]{background:rgba(255,255,255,.08);border-radius:12px}
.bs svg{display:block}
svg text{fill:var(--mute);font-family:var(--fb)}
/* Carte */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.cd{perspective:800px;aspect-ratio:3/4.1;position:relative;width:100%}
.cd .in{position:absolute;inset:0;transition:transform .6s;transform-style:preserve-3d}
.cd.fl .in{transform:rotateY(180deg)}
.cd .fa,.cd .fb{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:9px;display:flex;flex-direction:column;border:2px solid var(--c1);color:var(--ci);overflow:hidden}
.cd .fa{background:linear-gradient(160deg,var(--c1),var(--c2))}
.cd .fb{transform:rotateY(180deg);background:linear-gradient(160deg,var(--c2),var(--c1))}
.cd .ov{font-weight:900;font-size:30px;line-height:.9}
.cd .ps{font-weight:800;font-size:11px;letter-spacing:.1em}
.cd .ph{flex:1;display:grid;place-items:center;font-family:var(--fd);font-size:46px;opacity:.9}
.cd .nm{font-weight:900;font-size:13px;text-transform:uppercase;text-align:center;line-height:1.1;border-top:1px solid currentColor;padding-top:5px}
.cd .tm{font-size:10px;text-align:center;font-weight:700;opacity:.85}
.cd .rar{font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;text-align:center;margin-top:2px}
.cd .st{display:grid;grid-template-columns:1fr auto;gap:3px 6px;font-size:12px;font-weight:800;margin-top:6px}
.cd .st span:nth-child(odd){opacity:.8;font-weight:700}
.cd.bronzo{--c1:#a8683a;--c2:#e0a070;--ci:#2a1708}
.cd.argento{--c1:#9aa7b8;--c2:#e2e8f0;--ci:#16202e}
.cd.oro{--c1:#d9a21b;--c2:#ffe089;--ci:#3a2600}
.cd.eroe{--c1:#d62839;--c2:#ffd166;--ci:#20060b}
.cd.big{max-width:230px;margin:0 auto 12px}
.cd.big .ov{font-size:46px}.cd.big .ph{font-size:78px}.cd.big .nm{font-size:17px}.cd.big .st{font-size:14px}
/* Carriera */
.gauge{display:block;margin:0 auto}
.ob{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ob:first-of-type{border-top:0}
.ob img{height:30px;max-width:64px;object-fit:contain;border-radius:6px;background:#fff;padding:2px}
.ob .src{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--gold);color:#141d3d;font-weight:900;font-size:11px;text-align:center;line-height:1}
.pbar{height:7px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-top:5px}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:99px}
/* Conferenza */
.q{margin-bottom:12px}.q p{font-weight:800;margin-bottom:6px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opts button{padding:9px 6px;border-radius:12px;background:var(--glass2);border:1px solid var(--line);font-size:12px;font-weight:700;text-align:left;line-height:1.3}
.opts button[aria-pressed=true]{background:var(--gold);color:#141d3d;border-color:var(--gold)}
@media(max-width:440px){.opts{grid-template-columns:1fr}}
.post{border:1px solid var(--line);border-radius:18px;padding:12px;background:rgba(10,18,48,.55)}
.post .hd{display:flex;gap:10px;align-items:center}
.post .hd img{height:36px;background:#fff;border-radius:10px;padding:3px}
.post .hd b{display:block}
.post q{display:block;margin:8px 0;font-size:15px;quotes:none}
.rep{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px}
.rep b{color:var(--gold)}
/* Radio */
.wave{display:flex;align-items:center;gap:3px;height:64px;margin:12px 0}
.wave i{flex:1;border-radius:3px;background:rgba(255,255,255,.28);min-height:6px}
.wave i.on{background:var(--gold)}
.play{width:56px;height:56px;border-radius:50%;background:var(--red);border:1px solid #ff7a88;display:grid;place-items:center;flex:none}
.tr p{padding:8px 10px;border-radius:12px;margin-bottom:4px;color:var(--mute);transition:background .3s}
.tr p.on{background:rgba(255,209,102,.16);color:var(--ink)}
.tr p small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
/* Badge */
.prof{display:flex;gap:12px;align-items:center}
.prof .av{width:58px;height:58px;font-size:20px}
.bd{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.bd>div{text-align:center;padding:10px 6px;border-radius:16px;border:1px solid var(--line);background:var(--glass2)}
.bd>div.lock{opacity:.55}
.bd svg{display:block;margin:0 auto 4px}
.bd b{display:block;font-size:12px;line-height:1.2}
.bd small{display:block;font-size:10.5px;color:var(--mute);margin-top:2px}
.bd .pbar{margin-top:6px}
.note{font-size:11.5px;color:var(--mute);margin-top:6px}

.fb{margin-top:16px}
.fb .opts{grid-template-columns:repeat(3,1fr)}
.fb textarea,.fbn{width:100%;margin-top:8px;padding:10px 12px;border-radius:12px;background:#1d2a52;color:var(--ink);border:1px solid var(--line);font:inherit;min-height:64px;resize:vertical}
.fbn{min-height:0;margin:0 0 10px}
.sum{white-space:pre-wrap;font-size:13px;line-height:1.5;padding:12px;border-radius:14px;background:rgba(10,18,48,.55);border:1px solid var(--line);margin:10px 0}
.fbl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</div>

<script>
(function(){
var D=JSON.parse(document.getElementById('dati').textContent);
var $=function(s,e){return (e||document).querySelector(s)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function av(t,extra){return '<span class="av '+(extra||'')+'" style="background:hsl('+hue(t)+',55%,38%)">'+esc(t.replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase())+'</span>'}
function f1(n){return (Math.round(n*10)/10).toString().replace('.',',')}
function pos(t){for(var i=0;i<D.tab.length;i++)if(D.tab[i].t===t)return D.tab[i].pos;return 0}
function row(t){for(var i=0;i<D.tab.length;i++)if(D.tab[i].t===t)return D.tab[i]}
function hs(s){var h=7;for(var i=0;i<s.length;i++)h=(h*33+s.charCodeAt(i))>>>0;return h}
function rnd(seed){var x=seed>>>0;return function(){x=(x*1664525+1013904223)>>>0;return x/4294967296}}
var ME='Oranje VC';
$('#lg').src=D.img.lega;

var TABS=[['prob','Probabilità'],['sfide','Sfide'],['albo','Albo'],['derby','Derby'],['borsino','Borsino'],['carte','Carte'],['carriera','Carriera'],['conf','Conferenza'],['radio','Radio'],['badge','Badge'],['parere','Il tuo parere']];
var cur='prob',S={prob:'s',round:1,derbyRound:0,bors:0,carta:0,cteam:ME,conf:{},confDone:false,fb:{},fname:'',badgeTeam:ME,sfide:null,stake:50,opp:'Grodah'};

function where(a,b,c){return '<div class="where"><b>Dove</b><span>'+a+'</span><span class="sep">›</span><span>'+b+'</span>'+(c?'<span class="sep">›</span><span>'+c+'</span>':'')+'</div>'}

/* ---------- 1. PROBABILITÀ ---------- */
function vProb(){
  var k=S.prob,lab={s:'Scudetto',p:'Podio',u:'Ultimo posto'}[k];
  var arr=D.teams.slice().sort(function(a,b){return D.prob[b][k][1]-D.prob[a][k][1]});
  var h=where('Tabellone','Probabilità')+'<h2>Chi vince la lega</h2><p class="lead">Dopo ogni giornata simulo le giornate rimaste migliaia di volte, partendo dai punti fatti finora e dal calendario vero. Il numero è la percentuale di stagioni in cui la squadra chiude in quella posizione.</p>';
  h+='<div class="seg" role="group" aria-label="Tipo di probabilità">'+[['s','Scudetto'],['p','Podio'],['u','Ultimo']].map(function(x){return '<button data-prob="'+x[0]+'" aria-pressed="'+(k===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
  h+='<div class="card"><h3>'+lab+' · dopo la giornata 2</h3>';
  arr.forEach(function(t){var p=D.prob[t][k],d=p[1]-p[0],mx=Math.max(p[1],4);
    h+='<div class="pr"><div>'+av(t,t===ME?'me':'')+'</div><div class="grow"><b>'+esc(t)+'</b> <span class="mut sm">'+pos(t)+'° · '+row(t).pts+' pt</span><div class="bar '+(k==='u'?'u':'')+'"><i style="width:'+Math.min(100,p[1])+'%"></i></div></div><div class="pct num">'+f1(p[1])+'%<span class="dl '+((k==='u'?d<0:d>0)?'up':'dn')+'">'+(d>=0?'+':'')+f1(d)+' dalla G1</span></div></div>'});
  h+='</div><p class="note">Con due giornate giocate le percentuali ballano molto: era così anche dopo la prima. Dalla quinta o sesta diventano affidabili.</p>';
  return h;
}

/* ---------- 2. SFIDE ---------- */
function vSfide(){
  if(!S.sfide)S.sfide=[{a:'Oranje VC',b:'Apo team',st:100,s:'aperta',g:'G3'},{a:'Grodah',b:'WOA',st:40,s:'attesa',g:'G3'},{a:'Real Madrink',b:'Oranje VC',st:60,s:'chiusa',g:'G2',w:'Oranje VC',pa:74.0,pb:71.5}];

function series(p){var q=rnd(p.id*7+3),v=[p.q],x=p.q;for(var i=0;i<7;i++){x=Math.max(1,x+(q()-.5)*3.2*(1+p.q/20));v.unshift(x)}return v}

    s+='<text x="'+pad+'" y="'+(hh-4)+'" font-size="10">8 giornate fa</text><text x="'+(w-pad)+'" y="'+(hh-4)+'" font-size="10" text-anchor="end">Ora</text>'}

  var L=radioLines(),tot=L.reduce(function(s,x){return s+x[1].length},0),sec=Math.round(tot/14),bars=[];
  var q=rnd(42);for(var i=0;i<48;i++)bars.push(14+Math.round(q()*46));
  var h=where('Giornale','Radio O Girrr')+'<h2>Radio O Girrr</h2><p class="lead">Ogni mercoledì, insieme al PDF del Giornale, esce un riepilogo parlato di circa due minuti. Lo genero dal Giornale stesso, quindi non costa lavoro in più.</p><div class="card"><div class="row"><button class="play" id="play" aria-label="'+(RA.playing?'Pausa':'Riproduci')+'">'+(RA.playing?'<svg width="22" height="22" viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="#fff"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="#fff"/></svg>':'<svg width="22" height="22" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#fff"/></svg>')+'</button><div class="grow"><b>Giornata '+D.aw[D.aw.length-1].n+' · Il riepilogo</b><div class="mut sm">Durata '+Math.floor(sec/60)+':'+('0'+(sec%60)).slice(-2)+' · voce sintetica</div></div></div>';
  h+='<div class="wave" aria-hidden="true">'+bars.map(function(b,i){return '<i style="height:'+b+'px" class="'+(RA.i>=0&&i<=((RA.i+1)/L.length)*bars.length?'on':'')+'"></i>'}).join('')+'</div><div class="tr">'+L.map(function(x,i){return '<p class="'+(i===RA.i?'on':'')+'" data-line="'+i+'"><small>'+x[0]+'</small>'+esc(x[1])+'</p>'}).join('')+'</div></div><p class="note">Il tasto Riproduci usa la voce del tuo dispositivo, quindi il tono cambia da telefono a telefono. Nell\'app userei una voce italiana scelta bene.</p>';
  return h;
}
function radioStop(){RA.playing=false;try{speechSynthesis.cancel()}catch(e){}clearTimeout(RA.timer)}
function radioNext(){
  var L=radioLines();RA.i++;if(RA.i>=L.length){RA.i=-1;RA.playing=false;render();return}
  render();var txt=L[RA.i][1],done=false,go=function(){if(done)return;done=true;if(RA.playing)radioNext()};
  try{var u=new SpeechSynthesisUtterance(txt);u.lang='it-IT';u.onend=go;u.onerror=function(){RA.timer=setTimeout(go,txt.length*60)};speechSynthesis.speak(u);RA.timer=setTimeout(go,txt.length*90+1500)}catch(e){RA.timer=setTimeout(go,txt.length*70)}
}

/* ---------- 10. BADGE ---------- */
function medal(c1,c2,g){return '<svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true"><defs><linearGradient id="m'+g.length+c1.slice(1)+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+c1+'"/><stop offset="1" stop-color="'+c2+'"/></linearGradient></defs><polygon points="32,4 56,18 56,46 32,60 8,46 8,18" fill="url(#m'+g.length+c1.slice(1)+')" stroke="rgba(255,255,255,.7)" stroke-width="2"/><text x="32" y="40" text-anchor="middle" font-size="'+(g.length>2?14:22)+'" font-weight="900" style="fill:#141d3d">'+g+'</text></svg>'}
function vBadge(){
  var t=S.badgeTeam,r=row(t),mp=maxPts(t),mvps=D.aw.filter(function(a){return a.mvp[0]===t}).length,zz=D.aw.some(function(a){return a.rows&&false});
  var gol4=r.gf>=4,muro=r.gs===0;
  var B=[['Re della giornata','Miglior punteggio della lega',mvps>0,'🏆'.slice(0,0)+'1°',100,'#ffd166','#ff8a5c'],['Prima vittoria','Vinci una partita',r.v>0,'V',100,'#7be495','#3d93d6'],['Goleada','4 gol in una partita',r.gf>=4,'4G',Math.min(99,r.gf*25),'#ff6b7a','#ffd166'],['Cecchino','Oltre 80 punti in una giornata',mp>=80,'80',Math.round(mp/80*100),'#3d93d6','#bfe3ff'],['Muro','Una partita senza subire gol',muro,'0',muro?100:35,'#bfe3ff','#7be495'],['Serie da 3','3 vittorie di fila',false,'x3',Math.min(99,r.v*33),'#ffd166','#d62839'],['Panchina d\'oro','Il panchinaro batte il titolare',false,'P',20,'#e0a070','#ffd166'],['Derby vinto','Vinci un derby',false,'D',0,'#d62839','#ffd166'],['Veterano','Una stagione completa',false,'1',Math.round(r.g/38*100),'#9aa7b8','#e2e8f0']];
  var n=B.filter(function(b){return b[2]}).length;
  var h=where('Curva','Profilo','Badge')+'<h2>Badge e traguardi</h2><p class="lead">Medaglie che si sbloccano da sole con i risultati. Compaiono nel profilo in Curva, accanto al nome, e nella scheda della squadra in Squadre. Quelle ancora da conquistare restano visibili con la barra di avanzamento.</p>';
  h+='<select id="bteam" aria-label="Squadra" style="margin-bottom:12px">'+D.teams.map(function(x){return '<option'+(x===t?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select>';
  h+='<div class="card"><div class="prof">'+av(t,'')+'<div class="grow"><b style="font-size:18px">'+esc(t)+'</b><div class="mut sm">@'+esc(t.toLowerCase().replace(/[^a-z]/g,''))+' · '+r.pos+'° in lega</div><div class="sm" style="margin-top:4px"><span class="tag g">'+n+' su '+B.length+' badge</span></div></div></div></div>';
  h+='<div class="card"><h3>Traguardi</h3><div class="bd">'+B.map(function(b){return '<div class="'+(b[2]?'':'lock')+'">'+medal(b[2]?b[5]:'#6b7390',b[2]?b[6]:'#3b4468',b[3])+'<b>'+b[0]+'</b><small>'+b[1]+'</small>'+(b[2]?'<span class="tag o" style="margin-top:6px">Ottenuto</span>':'<div class="pbar"><i style="width:'+Math.max(4,b[4])+'%"></i></div>')+'</div>'}).join('')+'</div></div>';
  return h+'<p class="note">I badge "Re della giornata", "Prima vittoria", "Cecchino" e "Muro" sono calcolati sui risultati veri delle prime due giornate.</p>';
}


var FBL={si:'Mi piace',forse:'Da cambiare',no:'Non mi serve'};
function fbBox(){var f=S.fb[cur]||{};
  return '<div class="card fb"><h3>Che ne pensi di questa idea?</h3><div class="opts" role="group" aria-label="Voto">'+['si','forse','no'].map(function(k){return '<button data-fb="'+k+'" aria-pressed="'+(f.v===k)+'">'+FBL[k]+'</button>'}).join('')+'</div><textarea id="fbn" placeholder="Cosa cambieresti? Cosa manca? (facoltativo)" aria-label="Nota">'+esc(f.n||'')+'</textarea></div>'}
function summary(){var n=S.fname||'Un amico';var out='Parere di '+n+' sul Laboratorio O Girrr\n';
  TABS.forEach(function(t){if(t[0]==='parere')return;var f=S.fb[t[0]]||{};out+='\n- '+t[1]+': '+(f.v?FBL[f.v]:'non votata')+(f.n?' ("'+f.n.replace(/\n/g,' ')+'")':'')});return out}
function vParere(){
  var h='<h2>Il tuo parere</h2><p class="lead">Questo è il riassunto dei tuoi voti. Scrivi il tuo nome, copia il testo e incollalo a Gianluca su WhatsApp.</p><input class="fbn" id="fbname" placeholder="Il tuo nome" aria-label="Il tuo nome" value="'+esc(S.fname)+'"><div class="card"><div class="sum" id="sum">'+esc(summary())+'</div><button class="btn" id="copia" style="width:100%">Copia il riassunto</button><p class="note" id="cmsg"></p></div>';
  var d=Object.keys(S.fb).filter(function(k){return S.fb[k].v}).length;return h+'<p class="note">Hai votato '+d+' idee su '+(TABS.length-1)+'.</p>'}
var V={prob:vProb,sfide:vSfide,albo:vAlbo,derby:vDerby,borsino:vBors,carte:vCarte,carriera:vCar,conf:vConf,radio:vRadio,badge:vBadge,parere:vParere};
function render(){
  $('#view').innerHTML=V[cur]()+(cur==='parere'?'':fbBox());
  $('#tabs').innerHTML=TABS.map(function(t){return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(cur===t[0])+'">'+t[1]+'</button>'}).join('');
  try{var s=$('#tabs [aria-selected=true]');if(s&&s.scrollIntoView)s.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
}
function go(t){if(cur==='radio'&&t!=='radio'){radioStop();RA.i=-1}cur=t;try{history.replaceState(null,'','#'+t)}catch(e){}render();window.scrollTo(0,0)}
document.addEventListener('click',function(e){
  var b=e.target.closest('button,[data-card]');if(!b)return;var d=b.dataset;
  if(d.tab)return go(d.tab);
  if(d.fb){S.fb[cur]=S.fb[cur]||{};S.fb[cur].v=d.fb;return render()}
  if(b.id==='copia'){var tx=summary(),m=$('#cmsg');function fall(){var r=document.createRange();r.selectNodeContents($('#sum'));var s=getSelection();s.removeAllRanges();s.addRange(r);m.textContent='Testo selezionato: copialo con il tasto copia del telefono.'}
    try{navigator.clipboard.writeText(tx).then(function(){m.textContent='Copiato. Ora incollalo nella chat.'},fall)}catch(x){fall()}return}
  if(d.prob){S.prob=d.prob;return render()}
  if(d.round){S.round=+d.round;return render()}
  if(d.der){S.derbyRound=+d.der;return render()}
  if(d.bors){S.bors=+d.bors;return render()}
  if(d.pick){S.carta=+d.pick;return render()}
  if(d.q){S.conf[d.q]=+d.a;S.confDone=false;return render()}
  if(b.id==='pub'&&!b.disabled){S.confDone=true;render();var c=$('.post');if(c&&c.scrollIntoView)c.scrollIntoView({block:'center',behavior:'smooth'});return}
  if(b.id==='lancia'){S.sfide.unshift({a:ME,b:S.opp,st:S.stake,s:'attesa',g:'G3'});return render()}
  if(b.id==='play'){if(RA.playing){radioStop();return render()}RA.playing=true;try{speechSynthesis.cancel()}catch(x){}RA.i=RA.i<0?-1:RA.i-1;return radioNext()}
  if(d.card!==undefined&&b.classList.contains('big')){b.classList.toggle('fl')}
});
document.addEventListener('click',function(e){var c=e.target.closest('.cd.big');if(c&&!e.target.closest('button'))c.classList.toggle('fl')});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('big')){e.preventDefault();e.target.classList.toggle('fl')}});
document.addEventListener('change',function(e){var i=e.target.id;
  if(i==='opp'){S.opp=e.target.value;render()}
  if(i==='cteam'){S.cteam=e.target.value;render()}
  if(i==='bteam'){S.badgeTeam=e.target.value;render()}});
document.addEventListener('input',function(e){if(e.target.id==='fbn'){S.fb[cur]=S.fb[cur]||{};S.fb[cur].n=e.target.value}if(e.target.id==='fbname'){S.fname=e.target.value;var s=$('#sum');if(s)s.textContent=summary()}if(e.target.id==='stake'){S.stake=+e.target.value;var b=$('#lancia');var x=e.target.parentNode.querySelector('b.num');if(x)x.textContent=S.stake+' fantacredit'}});
var hh=(location.hash||'').slice(1);if(V[hh])cur=hh;
window.addEventListener('hashchange',function(){var x=(location.hash||'').slice(1);if(V[x]&&x!==cur)go(x)});
render();
})();
</script>
