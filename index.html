<title>Spogliatoio · O Fant A Girrr</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Lato:wght@400;700;900&family=Sora:wght@400;600;700;800&family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: night-stadium app. Header + tile tabs, glowing violet cards, swap cards (cedi/prendi), ring gauges.
   Single dark look by choice. Palette: deep indigo ground, violet cards, orange = cedi/risk, lime = prendi/ok, gold = gauge. */
:root{--fieldA:#2a1a7a;--hl:#ffc63a;--hl-ink:#2b1d00;--hl-bg:rgba(255,198,58,.13);--hl-name:#ffc63a;--fieldB:#1a0f55;color-scheme:dark;--fh:Rajdhani,'Saira Condensed',system-ui,sans-serif;--fb:Rajdhani,system-ui,sans-serif;--tt:none;--rad:16px;--tileA:#2c1873;--tileB:#1a0e47;--accA:#b3246f;--accB:#5c1c8f;--acc-ink:#ffffff;--acc-line:#e85aa8;--halo:124,92,255;--head:transparent;--head-ink:#f3efff;--body:radial-gradient(1200px 600px at 80% -10%,#3a1d8a 0%,transparent 60%),radial-gradient(900px 500px at -10% 30%,#2a1470 0%,transparent 55%);--sel:#b3246f;--sel-ink:#ffffff;--num:#ffc63a;--bg:#0e0730;--bg2:#1a0f45;--card:#22135a;--card2:#170c40;--ink:#f3efff;--mute:#a99fd0;--line:#4a2bd6;--glow:#7c5cff;--or:#ff5fa2;--or-ink:#1c0b00;--ok:#9cf24a;--mid:#4aa8ff;--warn:#ffc63a;--bad:#ff4f6d;--skin:#d9cdea;--skin2:#b3a3d6;--hair:#1c1238;--out:#0a0520;--chalk:#f3efff}
html{background:var(--bg)}
body{font-size:16px;color:var(--ink);font-family:var(--fb);min-height:100%}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--body),var(--bg)}
*{box-sizing:border-box}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:18px 56px}
h1,h2,h3,.disp{font-family:var(--fh);letter-spacing:.02em;text-transform:var(--tt);margin:0}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 16px;margin-bottom:6px;background:var(--head);color:var(--head-ink);border-radius:var(--rad)}header .sub,header .live{color:var(--head-ink);opacity:.8}header .name{color:var(--head-ink)}
h1{font-size:2.2rem;font-weight:800;line-height:1;text-shadow:0 0 22px rgba(var(--halo),.6)}
.sub{color:var(--mute);font-size:.85rem}
.live{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.8s infinite}
nav{display:flex;gap:8px;overflow-x:auto;margin-block:6px 18px;position:sticky;top:env(safe-area-inset-top,0px);padding-block:8px;z-index:5;background:var(--navbg,linear-gradient(var(--bg) 70%,transparent))}
nav button{flex:1 0 auto;font:700 1.02rem var(--fh);text-transform:var(--tt);letter-spacing:.05em;padding:12px 14px;border:1px solid var(--line);background:linear-gradient(160deg,var(--tileA),var(--tileB));color:var(--ink);border-radius:var(--rad);cursor:pointer;box-shadow:inset 0 0 14px rgba(var(--halo),.25)}
nav button[aria-selected=true]{background:linear-gradient(160deg,var(--accA),var(--accB));border-color:var(--acc-line);color:var(--acc-ink);box-shadow:0 4px 16px rgba(var(--halo),.45)}
button:focus-visible,input:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:3px solid var(--mid);outline-offset:2px}
.note{background:rgba(var(--halo),.12);border:1px solid var(--line);padding:10px 14px;border-radius:var(--rad);color:var(--mute);margin-bottom:14px;font-size:.88rem}
.list{display:grid;gap:12px}
.card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--rad);padding:14px;min-width:0;box-shadow:inset 0 0 22px rgba(var(--halo),.14),0 6px 18px rgba(0,0,0,.18)}
.row{display:grid;grid-template-columns:70px 1fr 68px;gap:12px;align-items:center;cursor:pointer}
.fig{display:block}
.pf{border-radius:calc(var(--rad) - 2px);background:linear-gradient(180deg,rgba(var(--halo),.35),rgba(var(--halo),.05));border:1px solid var(--line);overflow:hidden;line-height:0}
.row .pf{width:70px}
.name{font:700 1.3rem var(--fh);text-transform:var(--tt);line-height:1.1;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:.82rem}
.chips{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.chip{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:700 .72rem var(--fb);background:var(--line);color:var(--mute);border:0;padding:0}
.chip[data-s=T]{background:var(--ok);color:#0b2200}.chip[data-s=S]{background:var(--mid);color:#001a33}.chip[data-s=P]{background:var(--warn);color:#2b1d00}.chip[data-s=I]{background:var(--bad);color:#2b0008}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:.74rem;color:var(--mute);background:rgba(var(--halo),.1)}
.stat b{color:var(--ink);font:700 .95rem var(--fh);margin-left:4px}
.ring{width:68px;height:68px}
.ring text{font:800 20px var(--fh);fill:var(--ink)}
.ring .arc{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.verdict{font:700 .74rem var(--fb);text-transform:var(--tt);letter-spacing:.06em;padding:2px 8px;border-radius:999px}
.v-tieni{background:var(--ok);color:#0b2200}.v-osserva{background:var(--warn);color:#2b1d00}.v-scambia{background:var(--bad);color:#2b0008}
.edit{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:grid;gap:10px}
.edit .chips .chip{width:auto;min-width:46px;height:34px;padding-inline:6px;font-size:.78rem;cursor:pointer;gap:2px;grid-auto-flow:column}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn,select,input[type=number],input[type=range]{font:600 .9rem var(--fb)}
.btn{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(var(--halo),.18);color:var(--ink);cursor:pointer}
.btn.pri{background:linear-gradient(160deg,var(--accA),var(--accB));border-color:var(--acc-line);color:var(--acc-ink);font-weight:700}
.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(var(--halo),.14);color:var(--ink);font:600 .88rem var(--fb);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel);font-weight:700}
.fa{display:grid;grid-template-columns:30px 54px 1fr auto;gap:10px;align-items:center}
.fa .pf{width:54px}
.rank{font:800 1.4rem var(--fh);color:var(--or);text-align:center}
.mini{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:.78rem;color:var(--mute);margin-top:6px;align-items:center}
.score{font:800 1.9rem var(--fh);text-align:right;font-variant-numeric:tabular-nums;color:var(--num)}
.tag{font-size:.68rem;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--mute);text-transform:var(--tt)}
.swaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.swap{display:grid;gap:10px}
.swap .pair{display:grid;grid-template-columns:1fr 40px 1fr;gap:6px;align-items:center;text-align:center}
.swap .lb{font:700 .95rem var(--fh);letter-spacing:.04em}
.swap .cedi .lb{color:var(--or)}.swap .prendi .lb{color:var(--ok)}
.swap .pf{width:78px;margin:4px auto}
.swap .cedi .pf{border-color:var(--or);box-shadow:0 0 14px rgba(255,138,61,.35)}
.swap .prendi .pf{border-color:var(--ok);box-shadow:0 0 14px rgba(123,224,74,.35)}
.swap .nm{font:700 1.05rem var(--fh);text-transform:var(--tt);line-height:1.05;overflow-wrap:anywhere}
.swap .sm{font-size:.74rem;color:var(--mute)}
.spin{width:36px;height:36px;animation:spin 5s linear infinite}
.swap .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:8px;font-size:.8rem;color:var(--mute)}
.swap .foot b{font:800 1.3rem var(--fh);color:var(--num)}
.fld{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.help h3{font-size:1.2rem;margin-block:16px 6px}
.help p,.help li{color:var(--mute);margin:4px 0}
.help code{background:var(--line);padding:1px 6px;border-radius:6px;color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:var(--rad)}
@keyframes pulse{50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){h1{font-size:1.8rem}.row{grid-template-columns:58px 1fr 58px;gap:10px}.row .pf{width:58px}.ring{width:58px;height:58px}}
/* Skin 2: chiaro azzurro */
:root[data-skin="azzurro"]{--hl:#0a53e4;--hl-ink:#ffffff;--hl-bg:#e8f0ff;--hl-name:#0a53e4;--fieldA:#0c2f9c;--fieldB:#081c66;--fh:Lato,system-ui,sans-serif;--fb:Lato,system-ui,sans-serif;--tt:none;color-scheme:light;--rad:18px;--bg:#e9effb;--bg2:#d5e4ff;--card:#ffffff;--card2:#f4f8ff;--ink:#0b2a6b;--mute:#56698f;--line:#c7d8fb;--glow:#0a5bff;--or:#f26a1b;--ok:#18a04a;--mid:#0a5bff;--warn:#e59a00;--bad:#e0304e;--skin:#e6dccf;--skin2:#c9bba8;--hair:#2b2622;--out:#0b1c40;--chalk:#ffffff;--tileA:#ffffff;--tileB:#f1f6ff;--accA:#0a53e4;--accB:#0a3fc0;--acc-ink:#ffffff;--acc-line:#0646d6;--halo:10,91,255;--head:radial-gradient(140% 120% at 110% 120%,#19a8ff 0 30%,transparent 31%),radial-gradient(120% 110% at -10% -40%,#0a3fc0 0 45%,transparent 46%),#0a53e4;--head-ink:#ffffff;--body:repeating-linear-gradient(125deg,rgba(255,255,255,.55) 0 120px,transparent 120px 260px);--sel:#0a5bff;--sel-ink:#ffffff;--num:#0646d6}
/* Skin 3: Serie A (colori e atmosfera del sito e delle grafiche di campionato, senza loghi) */
:root[data-skin="seriea"]{--hl:#17dccb;--hl-ink:#0a1f5c;--hl-bg:rgba(23,220,203,.16);--hl-name:#1c4fb0;--fieldA:#12854b;--fieldB:#0c6638;--fh:Sora,system-ui,sans-serif;--fb:Sora,system-ui,sans-serif;--tt:uppercase;color-scheme:light;--rad:10px;--bg:#1b56b3;--bg2:#2aa3cf;--card:#ffffff;--card2:#f6f4f1;--ink:#0a1f5c;--mute:#51618c;--line:#d9e2f2;--glow:#17dccb;--or:#f0642a;--ok:#12a66a;--mid:#1c4fb0;--warn:#e7a400;--bad:#e2324f;--skin:#e6dccf;--skin2:#c9bba8;--hair:#2b2622;--out:#0a1433;--chalk:#ffffff;--tileA:#ffffff;--tileB:#ffffff;--accA:#17dccb;--accB:#17dccb;--acc-ink:#0a1f5c;--acc-line:#17dccb;--halo:28,79,176;--head:linear-gradient(100deg,#0a1f5c 0 58%,#1c4fb0 58% 100%);--head-ink:#ffffff;--body:linear-gradient(115deg,transparent 0 46%,rgba(255,255,255,.07) 46% 60%,transparent 60%),linear-gradient(245deg,transparent 0 46%,rgba(255,255,255,.07) 46% 60%,transparent 60%),linear-gradient(180deg,#1b56b3 0%,#2a8fd0 55%,#63dcd9 100%);--sel:#0a1f5c;--sel-ink:#ffffff;--num:#1c4fb0;--navbg:transparent}
:root[data-skin="seriea"] h1{font-size:1.7rem;letter-spacing:0}
:root[data-skin="seriea"] .name,:root[data-skin="seriea"] .swap .nm,:root[data-skin="seriea"] .gr .nm{font-size:1.05rem;font-weight:800;letter-spacing:0}
:root[data-skin="seriea"] nav button{font-size:.82rem;font-weight:700;color:#0a1f5c;border-color:transparent;box-shadow:0 2px 8px rgba(10,31,92,.18)}
:root[data-skin="seriea"] .card{box-shadow:0 4px 14px rgba(10,31,92,.22);border-color:transparent;background:linear-gradient(135deg,#ffffff 60%,#f1efec)}
:root[data-skin="seriea"] .note{background:rgba(255,255,255,.93);border-color:transparent}
:root[data-skin="seriea"] h2.sec{color:#fff}
:root[data-skin="seriea"] .seg button,:root[data-skin="seriea"] .skin button{background:#fff;border-color:transparent}
:root[data-skin="seriea"] .seg button[aria-pressed=true],:root[data-skin="seriea"] .skin button[aria-pressed=true]{background:#17dccb;color:#0a1f5c}
:root[data-skin="seriea"] .ring text,:root[data-skin="seriea"] .pct{font-size:17px}
:root[data-skin="seriea"] .verdict,:root[data-skin="seriea"] .stb{border-radius:4px}
:root[data-skin="seriea"] .empty{background:rgba(255,255,255,.93)}
/* Skin 4: album di figurine */
:root[data-skin="campo"]{--hl:#e2001a;--hl-ink:#ffffff;--hl-bg:#fff3b8;--hl-name:#e2001a;--fh:'Archivo Black','Arial Black',sans-serif;--fb:Archivo,system-ui,sans-serif;--tt:uppercase;--navbg:transparent;color-scheme:light;--fieldA:#2f9e4f;--fieldB:#268a43;--rad:6px;--bg:#f4ecd2;--bg2:#eadfbc;--card:#ffffff;--card2:#ffffff;--ink:#172a63;--mute:#5b6485;--line:#172a63;--glow:#e2001a;--or:#e2001a;--ok:#1c9a48;--mid:#1d5fd1;--warn:#f0a800;--bad:#e2001a;--out:#101b40;--chalk:#ffffff;--tileA:#ffd400;--tileB:#ffd400;--accA:#e2001a;--accB:#e2001a;--acc-ink:#ffffff;--acc-line:#172a63;--halo:23,42,99;--head:linear-gradient(180deg,#e2001a 0 calc(100% - 12px),#ffd400 calc(100% - 12px) 100%);--head-ink:#ffffff;--body:radial-gradient(rgba(23,42,99,.10) 1px,transparent 1.5px) 0 0/14px 14px;--sel:#172a63;--sel-ink:#ffd400;--num:#e2001a}
:root[data-skin="campo"] header{border:3px solid #172a63;box-shadow:4px 4px 0 #172a63;padding-bottom:26px}
:root[data-skin="campo"] h1{color:#ffd400;text-shadow:2px 2px 0 #172a63;letter-spacing:0;font-size:1.7rem}
:root[data-skin="campo"] nav button{border:2px solid #172a63;color:#172a63;font-size:.8rem;box-shadow:3px 3px 0 #172a63;letter-spacing:0}
:root[data-skin="campo"] nav button[aria-selected=true]{box-shadow:3px 3px 0 #172a63;color:#fff}
:root[data-skin="campo"] .card,:root[data-skin="campo"] .tw,:root[data-skin="campo"] .kpi div{border:2px solid #172a63;box-shadow:4px 4px 0 rgba(23,42,99,.85);background:#fff}
:root[data-skin="campo"] .note{background:#fff8d6;border:2px dashed #172a63;color:#172a63}
:root[data-skin="campo"] .pf{border:3px solid #fff;outline:2px solid #172a63;border-radius:3px;background:linear-gradient(180deg,#7cc4ff,#d9f0ff)}
:root[data-skin="campo"] .name,:root[data-skin="campo"] .swap .nm,:root[data-skin="campo"] .gr .nm,:root[data-skin="campo"] .rt td.n .nm{font-size:.98rem;letter-spacing:0}
:root[data-skin="campo"] .swap .nm{display:inline-block;background:#ffd400;border:2px solid #172a63;padding:2px 6px;margin-top:4px}
:root[data-skin="campo"] .swap .cedi .pf,:root[data-skin="campo"] .swap .prendi .pf{box-shadow:none;border-color:#fff}
:root[data-skin="campo"] .seg button,:root[data-skin="campo"] .skin button,:root[data-skin="campo"] .btn{background:#fff;border:2px solid #172a63;color:#172a63}
:root[data-skin="campo"] .seg button[aria-pressed=true],:root[data-skin="campo"] .skin button[aria-pressed=true]{background:#172a63;color:#ffd400}
:root[data-skin="campo"] .verdict,:root[data-skin="campo"] .stb,:root[data-skin="campo"] .stat,:root[data-skin="campo"] .fx{border-radius:3px;border:1.5px solid #172a63}
:root[data-skin="campo"] .rank{font-size:1.2rem;background:#ffd400;border:2px solid #172a63;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;color:#172a63}
:root[data-skin="campo"] .field{border:3px solid #172a63;box-shadow:4px 4px 0 rgba(23,42,99,.85)}
:root[data-skin="campo"] .field .pp .lab{background:#ffd400;color:#172a63;border:1.5px solid #172a63;border-radius:2px;font-size:.64rem}
:root[data-skin="campo"] .rt td{border-top:1.5px solid rgba(23,42,99,.25);font-size:.85rem}
:root[data-skin="campo"] .rt tr.xi td{background:#fff8d6}
:root[data-skin="campo"] .ring text{font-size:16px}
:root[data-skin="campo"] .empty{border:2px dashed #172a63;background:#fff8d6}
:root[data-skin="campo"] h2.sec{display:inline-block;background:#172a63;color:#ffd400;padding:3px 10px;font-size:1rem}
:root[data-skin="azzurro"] .card,:root[data-skin="campo"] .card{box-shadow:0 4px 14px rgba(var(--halo),.14)}
:root[data-skin="azzurro"] h1,:root[data-skin="campo"] h1,:root[data-skin="seriea"] h1{text-shadow:none}
.skin{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.skin button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 .82rem var(--fb);cursor:pointer}
.skin button[aria-pressed=true]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.rb{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font:800 .7rem var(--fb);color:#fff;flex:none;vertical-align:middle}
.rb.P{background:#e89a1a}.rb.D{background:#1f9d55}.rb.C{background:#2f8cf0}.rb.A{background:#d9363e}
:root[data-skin="azzurro"] .name,:root[data-skin="azzurro"] h1,:root[data-skin="azzurro"] h2,:root[data-skin="azzurro"] h3{font-weight:900;letter-spacing:0}
:root[data-skin="azzurro"] .name{font-size:1.15rem}
:root[data-skin="azzurro"] nav button{border-radius:999px;font-size:.92rem;letter-spacing:0;box-shadow:0 2px 8px rgba(10,83,228,.15)}
:root:not([data-skin]) nav button,:root[data-skin="viola"] nav button{letter-spacing:.01em;font-size:1.1rem}
:root:not([data-skin]) .name,:root[data-skin="viola"] .name{font-size:1.35rem}
:root:not([data-skin]) .card,:root[data-skin="viola"] .card{box-shadow:inset 0 0 26px rgba(124,92,255,.28),0 0 0 1px rgba(124,92,255,.25),0 8px 20px rgba(0,0,0,.4)}
.rosa{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.field{position:relative;border-radius:var(--rad);padding:20px 6px 14px;display:grid;gap:12px;background:repeating-linear-gradient(0deg,var(--fieldA) 0 60px,var(--fieldB) 60px 120px);overflow:hidden;border:1px solid var(--line)}
.field::before{content:"";position:absolute;inset:8px;border:2px solid rgba(255,255,255,.35);border-radius:6px;pointer-events:none}
.field::after{content:"";position:absolute;left:50%;bottom:8px;width:46%;height:46px;transform:translateX(-50%);border:2px solid rgba(255,255,255,.35);border-bottom:0;pointer-events:none}
.frow{display:flex;justify-content:space-around;gap:4px;position:relative;z-index:1}
.pp{flex:1 1 0;max-width:72px;text-align:center;min-width:0}
.pp .pf{width:min(50px,100%);margin:0 auto;border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.14)}
.pp .lab{display:block;margin-top:3px;font:700 .72rem var(--fb);color:#fff;background:rgba(0,0,0,.45);border-radius:999px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .sb{display:block;height:3px;border-radius:2px;margin:3px 8px 0}
.b-T{background:var(--ok)}.b-B{background:var(--mid)}.b-R,.b-D{background:var(--warn)}.b-P{background:var(--mute)}.b-I{background:var(--bad)}
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px 4px;margin-top:10px}
.bench .pp{max-width:none}.bench .pp .lab{background:transparent;color:var(--ink)}
.bench .pp.off{opacity:.45}

  var ks=Object.keys(TABN);Promise.all(ks.map(function(k){return gcn('scheda/'+k)})).then(function(r){var e=document.getElementById('gct');if(!e)return;var a=ks.map(function(k,i){return [TABN[k],r[i]||0]}).sort(function(x,y){return y[1]-x[1]});var tot=a.reduce(function(s,x){return s+x[1]},0),mx=a[0][1]||1;e.innerHTML=a.map(function(x){return '<div style="display:flex;align-items:center;gap:8px;margin:5px 0"><span style="width:110px">'+x[0]+'</span><i style="display:block;height:10px;border-radius:5px;background:var(--acc,#e7a400);width:'+Math.round(x[1]/mx*100)+'%;min-width:3px"></i><b>'+x[1]+'</b></div>'}).join('');var t=document.getElementById('gcs');if(t)t.textContent=tot;var m=document.getElementById('gcm');if(m)m.textContent=a[0][1]?a[0][0]:'–'});
  return '<div class="card"><h3 style="margin-bottom:6px">Quante volte è stato usato il sito</h3><p style="margin:0 0 12px;color:var(--mute)">Il conteggio è anonimo: non registra chi sei, solo quante volte il sito viene aperto e quali schede si usano. Parte dalla versione di oggi e si aggiorna con un po\' di ritardo (anche un\'ora): le aperture di adesso compaiono dopo.</p><div class="kpi" style="grid-template-columns:repeat(2,1fr)"><div><b id="gcn">–</b><span>Aperture totali</span></div><div><b id="gcu">–</b><span>Dispositivi diversi</span></div><div><b id="gcs">–</b><span>Schede aperte</span></div><div><b id="gcm">–</b><span>Scheda più usata</span></div></div></div><div class="card" style="margin-top:10px"><h3 style="margin-bottom:6px">Schede più usate</h3><div id="gct" style="color:var(--mute)">…</div></div><div class="card" style="margin-top:10px"><a class="btn pri" href="'+GC+'" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">Apri le statistiche complete</a></div><div class="hint">Un dispositivo nuovo si conta una sola volta; se rientra, sale solo il numero delle aperture. Nella pagina completa trovi anche paesi, browser e giorni.</div>';
}

    ['Punti svincolato','Il punteggio del giocatore da prendere.'],

    ['Il tuo percorso','L\'elenco di tutte le tue partite in ordine di data, con (C) per le gare in casa e (T) per quelle in trasferta.'],

document.getElementById('skin').addEventListener('click',function(e){var b=e.target.closest('button');if(b){LS.skin=b.dataset.skin;save();render()}});
document.getElementById('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b){tab=b.dataset.t;enter=true;render();track()}});
document.getElementById('who').addEventListener('click',function(e){if(e.target.id==='out'){LS.code='';save();gateErr=false;render()}});
app.addEventListener('click',function(e){
  var t=e.target,b=t.closest('[data-enter]');if(b){team=document.getElementById('gt').value;LS.team=team;LS.code=document.getElementById('gc').value.trim().toUpperCase();gateErr=!authed();save();render();trackOpen();return}
  b=t.closest('[data-f]');if(b){filter=b.dataset.f;render();return}
  b=t.closest('[data-role]');if(b){role=b.dataset.role;render();return}
  b=t.closest('[data-sort]');if(b){sortBy=b.dataset.sort;render();return}
  b=t.closest('[data-comp]');if(b){calComp=b.dataset.comp;calIdx=null;render();return}
  b=t.closest('[data-cal]');if(b){calIdx+=+b.dataset.cal;render();return}
  b=t.closest('[data-pt]');if(b){tipPt=tipPt===b.dataset.pt?null:b.dataset.pt;render();return}
  
  b=t.closest('[data-nophoto]');if(b){delete LS.photo[b.dataset.nophoto];save();render();return}
  b=t.closest('[data-o]');if(b){open=open===b.dataset.o?null:b.dataset.o;render()}
});
app.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.o){e.preventDefault();open=open===e.target.dataset.o?null:e.target.dataset.o;render()}});
app.addEventListener('change',function(e){
  var t=e.target,d=t.dataset;
  if(d.mod){LS.mod=t.value;LS.modUser=D.round;save();render();return}
  if(d.base){LS.base[d.base]=+t.value;save();render()}
  else if(d.photo&&t.files[0]){shrink(t.files[0],function(u){LS.photo[d.photo]=u;save();render()})}
  else if(d.cfg){cfg[d.cfg]=t.value;LS[d.cfg]=t.value;save();render()}
});
function shrink(file,cb){var img=new Image(),url=URL.createObjectURL(file);img.onload=function(){var c=document.createElement('canvas');c.width=c.height=96;var x=c.getContext('2d'),s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,96,96);URL.revokeObjectURL(url);cb(c.toDataURL('image/jpeg',0.72))};img.src=url}
function byHash(){var k=(location.hash||'').replace('#','').trim().toUpperCase();if(!k||!D.lock)return;D.teams.forEach(function(x){if(hsh(x.name+'|'+k)===D.lock[x.name]){team=x.name;LS.team=team;LS.code=k;save()}})}
byHash();render();
fetch('data.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.teams&&j.P&&(j.updated>=D.updated)){D=j;byHash();render()}trackOpen()}).catch(function(){trackOpen()});
})();
</script>
